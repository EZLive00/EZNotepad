name: Release (Windows)

# 触发方式两种：
#   1. 推一个 v* 标签（发布正式版）：git tag v1.0.0 && git push origin v1.0.0
#   2. 手动跑（Actions 页面 Run workflow），标签名取 tauri.conf.json 的版本，即 v<version>
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

# 创建 / 更新 Release 需要写 contents 权限；GITHUB_TOKEN 默认是只读
permissions:
  contents: write

# 同一条 tag 的重复触发排队执行，避免两次构建同时往一个 Release 上传 assets
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # 版本号只认 tauri.conf.json 一处：手动触发时标签名由它推出来，
      # 不在 workflow 里再写一遍（写死就会跟着版本号脱节）
      - name: 读取版本号
        id: ver
        shell: pwsh
        run: |
          $v = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          Write-Output "tauri.conf.json version = $v"
          Write-Output "version=$v" >> $env:GITHUB_OUTPUT

      - name: 安装 pnpm
        # 版本由 package.json 的 packageManager 字段钉死，本地 CI 同一份
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # 依赖 pnpm-lock.yaml，缓存后安装从数分钟降到十几秒
          cache: pnpm

      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          # 冒号语法是插件约定：左边是 Cargo 工作区目录，右边是 target 目录名
          workspaces: src-tauri -> target
          # release profile 开了 lto + codegen-units=1，冷构建十几分钟，
          # 缓存命中后能砍掉大半
          key: release-windows

      - name: 安装前端依赖
        # frozen-lockfile：锁文件与 package.json 不一致就直接报错，
        # 不会悄悄升级依赖版本（本仓库的唯一锁文件是 pnpm-lock.yaml）
        run: pnpm install --frozen-lockfile

      # 构建/发布拆成显式步骤而不是用 tauri-action 一把梭：
      # 构建失败时错误行会以 ::error:: 注解打出来，API 匿名就能读到，
      # 不用管理员令牌拉日志（tauri-action 把输出吞在自己的步骤里，出错了黑箱）。
      - name: 构建
        shell: pwsh
        run: |
          & pnpm exec tauri build --verbose 2>&1 | Tee-Object -FilePath build-output.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            $lines = Get-Content build-output.log
            $hits = @($lines | Where-Object { $_ -match 'error|failed|panicked' } | Select-Object -First 15)
            $tail = @($lines | Select-Object -Last 6)
            foreach ($l in ($hits + $tail)) { Write-Output ('::error::' + $l) }
            exit $code
          }

      # 免安装版：Tauri 在 Windows 上没有独立的 portable 打包目标，
      # 裸 exe 就是便携版（前端资源与图标都编进了二进制，双击即用；
      # 只依赖系统 WebView2，Win10/11 自带），压成 zip 作为第二个产物。
      - name: 打包免安装版
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $zip = "src-tauri/target/release/EZNotepad_${version}_x64-portable.zip"
          Compress-Archive -Path src-tauri/target/release/EZNotepad.exe -DestinationPath $zip -Force
          Write-Output "portable: $zip"

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          # 推标签时用标签名；手动跑时用上面读到的 tauri.conf.json 版本号
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          body: |
            Windows 安装包（NSIS）+ 免安装版（zip，解压即用）。

            两者都未做代码签名，首次运行 SmartScreen 会拦一次：
            点「更多信息」→「仍要运行」。

            免安装版不写注册表、不注册文件关联；需要系统自带 WebView2（Win10/11 均已内置）。
          # 上面是固定说明，下面自动附上本次的提交清单
          generate_release_notes: true
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/EZNotepad_*_x64-portable.zip
          fail_on_unmatched_files: true

      - name: 备份产物为 Artifact
        # 即使创建 Release 失败（比如标签冲突、权限问题），
        # 安装包仍然能从 Actions 页面下载，不至于白跑一次
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/EZNotepad_*_x64-portable.zip
          if-no-files-found: warn
