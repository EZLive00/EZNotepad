name: Release (macOS)

# platform/macos 是独立分支，不用 main 的 Windows 发版流程。
# 触发方式两种：推 v* 标签（正式版）或 Actions 页面手动跑。
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  macos:
    # universal 要编两套 target 再 lipo，M1 的 macos-latest 只有 7GB，
    # lto=true 的全量编译容易吃紧；Intel runner 有 14GB。
    runs-on: macos-15-intel
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 读取版本号
        id: ver
        run: |
          v=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "tauri.conf.json version = $v"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # universal 需要两个 target 都在（bundler 用 lipo 合成）
      - name: 安装 Rust 工具链
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: 缓存 Rust 编译产物
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: release-macos-universal

      - name: 安装前端依赖
        run: pnpm install --frozen-lockfile

      - name: 构建
        run: pnpm exec tauri build --target universal-apple-darwin --bundles app,dmg --verbose

      - name: 打包免安装版
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          BUNDLE="src-tauri/target/universal-apple-darwin/release/bundle"
          cd "$BUNDLE/macos"
          zip -q -r -y "../../../../../../EZNotepad_${VERSION}_macos-portable.zip" EZNotepad.app
          cd -

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.ver.outputs.version) }}
          body: |
            macOS 通用包（Apple Silicon + Intel）：dmg 安装镜像 + 免安装 zip。

            **未签名、未公证**。首次打开请右键 → 打开 → 确认，或执行
            `xattr -cr /Applications/EZNotepad.app`。要分发给他人不出现提示，
            需要 Apple 开发者账号并配置签名与公证（见 docs/macOS-开发.md M6）。

            需要 macOS 11.0 或更新版本。导出 PDF 在这个版本仍不可用。
          generate_release_notes: true
          files: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            EZNotepad_*_macos-portable.zip
          fail_on_unmatched_files: true

      - name: 备份产物为 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-installers
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            EZNotepad_*_macos-portable.zip
          if-no-files-found: warn
