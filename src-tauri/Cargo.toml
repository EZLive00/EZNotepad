[package]
name = "simple-notepad"
version = "1.0.2"
description = "EZNotepad - lightweight Markdown / text editor and diff tool"
authors = ["EZNotepad"]
edition = "2021"
rust-version = "1.90"

# 产物名与 tauri.conf.json 的 productName 对齐：
# target/release/EZNotepad.exe 即免安装版本体，CI 直接拿它压便携包。
[[bin]]
name = "EZNotepad"
path = "src/main.rs"

[lib]
name = "simple_notepad_lib"
# staticlib 只有 iOS 需要，桌面端完全用不到，但它在 debug 下是一个 ~748MB 的
# simple_notepad_lib.lib，每次构建都要重新生成、旧的那份被删掉。桌面项目别留它。
# （以后真要出 iOS，把 "staticlib" 加回来即可。）
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
# 单实例：双击第二个文件时交给已开的窗口，而不是再起一个进程互相覆盖
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
# 跨文件搜索 / 替换的正则支持（可选开启，默认仍是字面匹配）
regex = "1"
# 文件变化监听：只监听已打开文档所在目录这一层，靠系统原生的
# ReadDirectoryChangesW / inotify，空闲时零 CPU。
notify = "8"

# 无边框窗口的系统圆角（Win11 DWM）。只在 Windows 上参与编译。
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.dev]
# 只留行号表：panic 回栈仍有 file:line，但产物小一个量级。
# 满级 debuginfo 下 dev 产物是 rlib 311MB + pdb 205MB，每次构建都会把旧的那份删掉。
debug = 1

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
