[package]
name = "simple-notepad"
version = "1.0.0"
description = "简单记事本 - 轻量 Markdown / 文本编辑器 与 文本对比"
authors = ["简单记事本"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "simple_notepad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
# 文件变化监听：只监听已打开文档所在目录这一层，靠系统原生的
# ReadDirectoryChangesW / inotify，空闲时零 CPU。
notify = "8"

# 无边框窗口的系统圆角（Win11 DWM）。只在 Windows 上参与编译。
[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Dwm"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
