<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>EZNotepad</title>
<link rel="stylesheet" href="styles.css" />
<link rel="stylesheet" href="css/compare.css" />
</head>
<body data-theme="light">

<div class="cmp">
  <!-- 第一行：标题 + 左右文件 + 窗口按钮（整行可拖动窗口） -->
  <header class="cmp-top" data-tauri-drag-region>
    <div class="cmp-brand" data-tauri-drag-region>
      <svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z" />
        <path d="M9 10h6M12 13V7M9 17h6" />
      </svg>
      <span data-i18n="文本对比">文本对比</span>
    </div>

    <div class="cmp-slots" data-tauri-drag-region>
      <button class="cmp-slot" id="slotL" title="选择左侧文件" data-i18n-title="选择左侧文件">
        <span class="cmp-dot" id="dotL"></span>
        <span class="cmp-slot-name" id="nameL">左侧未选择</span>
      </button>
      <button class="cmp-swap" id="swap" title="交换左右" data-i18n-title="交换左右">
        <svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3 4 7l4 4M4 7h16m-4 14 4-4-4-4M20 17H4" />
        </svg>
      </button>
      <button class="cmp-slot" id="slotR" title="选择右侧文件" data-i18n-title="选择右侧文件">
        <span class="cmp-dot" id="dotR"></span>
        <span class="cmp-slot-name" id="nameR">右侧未选择</span>
      </button>
    </div>

    <div class="cmp-wbtns">
      <button class="cmp-wbtn" id="wmin" title="最小化" data-i18n-title="最小化">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="M2.5 6h7" /></svg>
      </button>
      <button class="cmp-wbtn" id="wmax" title="最大化 / 还原" data-i18n-title="最大化 / 还原">
        <svg viewBox="0 0 12 12" aria-hidden="true"><rect x="2.5" y="2.5" width="7" height="7" /></svg>
      </button>
      <button class="cmp-wbtn danger" id="wclose" title="关闭" data-i18n-title="关闭">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9" /></svg>
      </button>
    </div>
  </header>

  <!-- 第二行：统计 + 选项 + 导航 + 动作 -->
  <div class="cmp-tools" id="tools">
    <span class="cmp-stat" id="stat">选两个文件，或者直接粘贴两段文本</span>
    <span class="cmp-cur" id="curInfo"></span>
    <div class="cmp-tools-gap"></div>

    <label class="cmp-chk" title="比较时忽略行首行尾空白与连续空格" data-i18n-title="比较时忽略行首行尾空白与连续空格"><input type="checkbox" id="optWS" checked /><span data-i18n="忽略空白">忽略空白</span></label>
    <label class="cmp-chk" title="比较时忽略大小写" data-i18n-title="比较时忽略大小写"><input type="checkbox" id="optCase" /><span data-i18n="忽略大小写">忽略大小写</span></label>
    <label class="cmp-chk" title="相同行收起来，只留差异和前后 3 行；编辑时自动展开" data-i18n-title="相同行收起来，只留差异和前后 3 行；编辑时自动展开"><input type="checkbox" id="optFold" checked /><span data-i18n="只看差异">只看差异</span></label>

    <div class="cmp-sep"></div>

    <button class="cmp-btn" id="prev" title="上一处差异 (Shift+F7)" data-i18n-title="上一处差异 (Shift+F7)"><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg><span data-i18n="上一处">上一处</span></button>
    <button class="cmp-btn" id="next" title="下一处差异 (F8)" data-i18n-title="下一处差异 (F8)"><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg><span data-i18n="下一处">下一处</span></button>
    <button class="cmp-btn" id="pushBtn" title="把这一处差异整段同步到右侧 (Alt+→)" disabled><svg class="cmp-ico" id="pushIco" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h15M13 6l6 6-6 6" /></svg><span id="pushLabel" data-i18n="复制到右侧">复制到右侧</span></button>
    <button class="cmp-btn" id="listBtn" title="差异清单：按位置 / 类型 / 行数排序，可筛选" data-i18n-title="差异清单：按位置 / 类型 / 行数排序，可筛选" aria-expanded="false" aria-controls="listPanel"><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01" /></svg><span data-i18n="差异清单">差异清单</span></button>
    <button class="cmp-btn" id="findBtn" title="在两侧查找 (Ctrl+F)" data-i18n-title="在两侧查找 (Ctrl+F)" data-i18n-aria="查找"><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /></svg><span data-i18n="查找">查找</span></button>

    <div class="cmp-sep"></div>

    <button class="cmp-btn" id="sortBtn" title="把两侧的行按字典序重排，空行留在末尾（Ctrl+Z 撤销）" data-i18n-title="把两侧的行按字典序重排，空行留在末尾（Ctrl+Z 撤销）"><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 17 4-10 4 10M4.6 14h4.8M15 7h5l-5 8h5"/></svg><span data-i18n="排序">排序</span></button>
    <button class="cmp-btn" id="undoBtn" title="撤销 (Ctrl+Z)" data-i18n-title="撤销 (Ctrl+Z)" data-i18n-aria="撤销" disabled><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h10.5A5.5 5.5 0 0 1 20 14.5 5.5 5.5 0 0 1 14.5 20H11" /></svg><span data-i18n="撤销">撤销</span></button>
    <button class="cmp-btn" id="redoBtn" title="重做 (Ctrl+Y)" data-i18n-title="重做 (Ctrl+Y)" data-i18n-aria="重做" disabled><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9.5A5.5 5.5 0 0 0 4 14.5 5.5 5.5 0 0 0 9.5 20H13" /></svg><span data-i18n="重做">重做</span></button>
    <button class="cmp-btn" id="toggleEdit" title="允许直接改写左右两侧的文本（E）" data-i18n-title="允许直接改写左右两侧的文本（E）" data-i18n-aria="编辑"><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9" /><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z" /></svg><span data-i18n="编辑">编辑</span></button>
    <button class="cmp-btn" id="save" title="把改动写回磁盘 (Ctrl+S)" data-i18n-title="把改动写回磁盘 (Ctrl+S)" data-i18n-aria="保存" disabled><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M15.2 3a2 2 0 0 1 1.4.6l3.8 3.8a2 2 0 0 1 .6 1.4V19a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" /><path d="M17 21v-7a1 1 0 0 0-1-1H8a1 1 0 0 0-1 1v7" /><path d="M7 3v4a1 1 0 0 0 1 1h7" /></svg><span data-i18n="保存">保存</span></button>
    <button class="cmp-btn" id="report" title="导出为独立的 HTML 对比报告" data-i18n-title="导出为独立的 HTML 对比报告" data-i18n-aria="导出报告" disabled><svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" /><path d="m7 10 5 5 5-5" /><path d="M12 15V3" /></svg><span data-i18n="导出报告">导出报告</span></button>
  </div>

  <!-- 上限提示：文件超限时停在这里说明原因，不加载 -->
  <div class="cmp-warn" id="warn" hidden>
    <svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v5M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></svg>
    <span class="cmp-warn-t" id="warnText"></span>
    <button class="cmp-warn-x" id="warnX" title="关闭" data-i18n-title="关闭">
      <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9" /></svg>
    </button>
  </div>

  <!-- 关窗守卫：有未保存的改动时挡一下，别让 Alt+F4 静默丢掉改过的内容 -->
  <div class="cmp-confirm" id="confirm" hidden>
    <svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 9v5M12 17h.01M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z" /></svg>
    <span class="cmp-confirm-t" id="confirmText"></span>
    <button class="cmp-btn" id="confirmCancel" data-i18n="取消">取消</button>
    <button class="cmp-btn" id="confirmDrop" data-i18n="不保存">不保存</button>
    <button class="cmp-btn primary" id="confirmSave" data-i18n="保存并关闭">保存并关闭</button>
  </div>

  <!-- 正文：左栏 / 右栏 / 预览条 -->
  <div class="cmp-main" id="main">
    <section class="cmp-pane" id="paneL">
      <div class="cmp-ph">
        <span class="cmp-ph-name" id="phL" data-i18n="左侧">左侧</span>
        <span class="cmp-ph-meta" id="metaL"></span>
      </div>
      <div class="cmp-sc" id="scrollL">
        <div class="cmp-cv" id="canvasL"><div class="cmp-rows" id="rowsL"></div><div class="cmp-curbox" id="curL" hidden></div></div>
      </div>
    </section>

    <div class="cmp-div"></div>

    <section class="cmp-pane" id="paneR">
      <div class="cmp-ph">
        <span class="cmp-ph-name" id="phR" data-i18n="右侧">右侧</span>
        <span class="cmp-ph-meta" id="metaR"></span>
      </div>
      <div class="cmp-sc" id="scrollR">
        <div class="cmp-cv" id="canvasR"><div class="cmp-rows" id="rowsR"></div><div class="cmp-curbox" id="curR" hidden></div></div>
      </div>
    </section>

    <aside class="cmp-ruler" id="ruler" title="预览条：红 = 有差异，蓝 = 当前这处，灰框 = 正在看的范围；点击或拖动可快速定位" data-i18n-title="预览条：红 = 有差异，蓝 = 当前这处，灰框 = 正在看的范围；点击或拖动可快速定位">
      <canvas id="rulerC"></canvas>
      <div class="cmp-rtip" id="rulerTip" hidden></div>
    </aside>

    <!-- 查找条：浮在正文右上角，像编辑器那样 Ctrl+F 唤出。 -->
    <div class="cmp-find" id="findBar" hidden>
      <input type="search" id="findInput" placeholder="查找" data-i18n-placeholder="查找" spellcheck="false" autocomplete="off" />
      <span class="cmp-find-n" id="findN"></span>
      <button class="cmp-find-b" id="findPrev" title="上一个匹配 (Shift+Enter)" data-i18n-title="上一个匹配 (Shift+Enter)">
        <svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m18 15-6-6-6 6" /></svg>
      </button>
      <button class="cmp-find-b" id="findNext" title="下一个匹配 (Enter)" data-i18n-title="下一个匹配 (Enter)">
        <svg class="cmp-ico" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
      </button>
      <button class="cmp-find-x" id="findClose" title="关闭 (Esc)" data-i18n-title="关闭 (Esc)">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9" /></svg>
      </button>
    </div>
  </div>

  <!-- 差异清单：从工具栏展开，排序 / 筛选 / 跳转 -->
  <div class="cmp-list" id="listPanel" hidden role="dialog" data-i18n-aria="差异清单">
    <div class="cmp-list-hd">
      <span class="cmp-list-t" data-i18n="差异清单">差异清单</span>
      <span class="cmp-list-n" id="listN"></span>
      <button class="cmp-list-x" id="listX" title="关闭 (Esc)" data-i18n-title="关闭 (Esc)">
        <svg viewBox="0 0 12 12" aria-hidden="true"><path d="m3 3 6 6M9 3 3 9" /></svg>
      </button>
    </div>
    <div class="cmp-list-ft" id="listFilter">
      <button type="button" data-f="all" class="on" data-i18n="全部">全部</button>
      <button type="button" data-f="chg" data-i18n="修改">修改</button>
      <button type="button" data-f="del" data-i18n="仅左">仅左</button>
      <button type="button" data-f="add" data-i18n="仅右">仅右</button>
    </div>
    <div class="cmp-list-cols">
      <button type="button" class="cmp-list-sort" data-sort="pos" data-i18n="位置">位置</button>
      <button type="button" class="cmp-list-sort" data-sort="kind" data-i18n="类型">类型</button>
      <button type="button" class="cmp-list-sort" data-sort="size" data-i18n="行数">行数</button>
      <span data-i18n="内容">内容</span>
    </div>
    <div class="cmp-list-bd" id="listBody"></div>
  </div>

  <div class="cmp-empty" id="empty">
    <div class="cmp-empty-box">
      <div class="cmp-empty-t" data-i18n="没有可对比的内容">没有可对比的内容</div>
      <div class="cmp-empty-s" data-i18n="选两个文件，或者直接粘贴两段文本">选两个文件，或者直接粘贴两段文本</div>
      <div class="cmp-empty-btns">
        <button class="cmp-btn primary" id="pickL" data-i18n="选择左侧文件">选择左侧文件</button>
        <button class="cmp-btn primary" id="pickR" data-i18n="选择右侧文件">选择右侧文件</button>
        <button class="cmp-btn" id="pastePair" title="两侧都开成空白文本，直接 Ctrl+V 粘进来对比" data-i18n-title="两侧都开成空白文本，直接 Ctrl+V 粘进来对比" data-i18n="粘贴两段文本">粘贴两段文本</button>
      </div>
    </div>
  </div>
</div>

<div id="toasts"></div>
<script type="module" src="js/compare.js"></script>
</body>
</html>
