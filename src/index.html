  <!-- ============ 顶部：标题栏（菜单 + 标题 + 窗口按钮）｜标签与工具行 ============ -->
  <header class="appbar">
    <div class="titlebar" data-tauri-drag-region>
      <div class="brand" title="EZNotepad">
        <span class="brand-mark"><svg class="ico" aria-hidden="true"><use href="#i-notebook-pen" /></svg></span>
      </div>
      <nav class="menubar" id="menubar" aria-label="主菜单" data-i18n-aria="主菜单"></nav>
      <div class="titlebar-fill" data-tauri-drag-region></div>
      <div class="win-title" id="winTitle" data-tauri-drag-region></div>
      <div class="win-ctrl">
        <button class="wc" id="wcMin" title="最小化" data-i18n-title="最小化" tabindex="-1"><svg class="ico" aria-hidden="true"><use href="#i-minus" /></svg></button>
        <button class="wc" id="wcMax" title="最大化" data-i18n-title="最大化" tabindex="-1"><svg class="ico" id="wcMaxIcon" aria-hidden="true"><use href="#i-square" /></svg></button>
        <button class="wc danger" id="wcClose" title="关闭" data-i18n-title="关闭" tabindex="-1"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button>
      </div>
    </div>

    <div class="tabbar">
      <div class="tabs" id="tabs"></div>
      <button class="tab-add" id="tabAdd" title="新建标签 (Ctrl+T)" data-i18n-title="新建标签 (Ctrl+T)"><svg class="ico" aria-hidden="true"><use href="#i-plus" /></svg></button>
      <div class="tabbar-fill" data-tauri-drag-region></div>

      <!-- 工具行只留三个高频动作，其余（新建/打开/单栏双栏/大纲/格式化/对比/主题）
           都在菜单里有，且带勾选状态 —— 宁可省行宽，也不重复摆放 -->
      <div class="toolbar" id="toolbar">
        <div class="dropdown" id="modeDropdown">
          <button class="tb" id="btnMode">
            <svg class="ico" id="modeIcon" aria-hidden="true"><use href="#i-code" /></svg><span id="modeLabel">编辑</span><svg class="ico caret" aria-hidden="true"><use href="#i-chevron-down" /></svg>
          </button>
          <div class="menu-panel" id="modeMenu">
            <button data-mode="wysiwyg"><b><span data-i18n="所见即所得">所见即所得</span><svg class="ico menu-check" aria-hidden="true"><use href="#i-check" /></svg></b><small data-i18n="输入即渲染，富文本体验">输入即渲染，富文本体验</small></button>
            <button data-mode="edit"><b><span data-i18n="编辑模式">编辑模式</span><svg class="ico menu-check" aria-hidden="true"><use href="#i-check" /></svg></b><small data-i18n="显示原始 Markdown / 源码">显示原始 Markdown / 源码</small></button>
            <button data-mode="preview"><b><span data-i18n="预览模式">预览模式</span><svg class="ico menu-check" aria-hidden="true"><use href="#i-check" /></svg></b><small data-i18n="只读，仅查看渲染结果">只读，仅查看渲染结果</small></button>
            <div class="menu-note" id="modeNote"></div>
          </div>
        </div>

        <button class="tb icon-only" id="btnFind" title="查找替换 (Ctrl+F)" data-i18n-title="查找替换 (Ctrl+F)"><svg class="ico" aria-hidden="true"><use href="#i-search" /></svg></button>
        <button class="tb" id="btnSave" title="保存 (Ctrl+S)" data-i18n-title="保存 (Ctrl+S)"><svg class="ico" aria-hidden="true"><use href="#i-save" /></svg><span data-i18n="保存">保存</span></button>
      </div>
    </div>
  </header>

  <!-- ============ 主区域：大纲 | 编辑 | 预览 ============ -->
  <main class="workspace" id="workspace">
    <aside class="outline" id="outlinePane">
      <div class="side-head">
        <div class="side-tabs">
          <button type="button" class="side-tab active" data-side="outline" data-i18n="大纲">大纲</button>
          <button type="button" class="side-tab" data-side="files" data-i18n="文件">文件</button>
        </div>
      </div>

      <!-- 大纲：只管导航 -->
      <div class="side-body" id="sideOutline">
        <div class="outline-list" id="outlineList"></div>
      </div>

      <!-- 文件：文件夹树 + 全目录搜索 -->
      <div class="side-body hidden" id="sideFiles">
        <div class="ft-search">
          <svg class="ico" aria-hidden="true"><use href="#i-search" /></svg>
          <input id="ftQuery" placeholder="在这个文件夹里搜内容" data-i18n-ph="在这个文件夹里搜内容" spellcheck="false" />
          <button type="button" class="ft-tog" id="ftRegex" title="按正则表达式匹配" data-i18n-title="按正则表达式匹配">.*</button>
          <button type="button" class="ft-x icon-only hidden" id="ftClear" title="清除搜索" data-i18n-title="清除搜索">
            <svg class="ico" aria-hidden="true"><use href="#i-x" /></svg>
          </button>
        </div>
        <div class="ft-search ft-replace hidden" id="ftReplaceRow">
          <input id="ftReplaceInput" placeholder="替换为（留空即删除）" data-i18n-ph="替换为（留空即删除）" spellcheck="false" />
          <button type="button" class="ft-tog" id="ftCase" title="区分大小写" data-i18n-title="区分大小写">Aa</button>
          <button type="button" class="ft-rep-all" id="ftReplaceAll" data-i18n="全部替换">全部替换</button>
        </div>
        <div class="ft-path">
          <span id="ftPathText" title="">未打开文件夹</span>
          <button type="button" class="ft-open" id="ftPick" data-i18n="选择…">选择…</button>
        </div>
        <div class="ft-body" id="ftBody"></div>
      </div>
    </aside>
    <div class="splitter" id="outlineSplitter"></div>

    <section class="editor-pane" id="editorPane">
      <div class="findbar hidden" id="findbar">
        <!-- 箭头展开替换行：折叠时只有查找，展开后多一行「替换为」。
             模式开关做成输入框右侧的小方格，不再另起一行复选框 -->
        <div class="fb-row">
          <button class="fb icon-only fb-arrow" id="findExpand" title="展开替换（Ctrl+H）" data-i18n-title="展开替换（Ctrl+H）" aria-expanded="false">
            <svg class="ico" aria-hidden="true"><use href="#i-chevron-right" /></svg>
          </button>
          <span class="fb-field">
            <textarea id="findInput" rows="1" placeholder="查找" data-i18n-ph="查找" spellcheck="false"></textarea>
            <button class="fb-mini" id="findNewline" title="插入换行（Ctrl+Enter）" data-i18n-title="插入换行（Ctrl+Enter）">↵</button>
          </span>
          <span class="fb-modes">
            <label class="fb-toggle" title="区分大小写（Alt+C）" data-i18n-title="区分大小写（Alt+C）"><input type="checkbox" id="findCase" /><span>Aa</span></label>
            <label class="fb-toggle" title="正则表达式（Alt+R）" data-i18n-title="正则表达式（Alt+R）"><input type="checkbox" id="findRegex" /><span class="fb-mono">.*</span></label>
            <label class="fb-toggle" title="整词匹配（Alt+W）" data-i18n-title="整词匹配（Alt+W）"><input type="checkbox" id="findWord" /><span data-i18n="全词">全词</span></label>
            <label class="fb-toggle" id="findScopeWrap" title="只在选中的文字里查找" data-i18n-title="只在选中的文字里查找"><input type="checkbox" id="findScope" /><span data-i18n="选区">选区</span></label>
          </span>
          <span class="find-count" id="findCount">0/0</span>
          <button class="fb icon-only" id="findPrev" title="上一个 (Shift+Enter)" data-i18n-title="上一个 (Shift+Enter)"><svg class="ico" aria-hidden="true"><use href="#i-chevron-up" /></svg></button>
          <button class="fb icon-only" id="findNext" title="下一个 (Enter)" data-i18n-title="下一个 (Enter)"><svg class="ico" aria-hidden="true"><use href="#i-chevron-down" /></svg></button>
          <button class="fb close" id="findClose" title="关闭 (Esc)" data-i18n-title="关闭 (Esc)"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button>
        </div>
        <div class="fb-row fb-replace-row hidden" id="findReplaceRow">
          <span class="fb-field">
            <textarea id="replaceInput" rows="1" placeholder="替换为" data-i18n-ph="替换为" spellcheck="false"></textarea>
            <button class="fb-mini" id="replaceNewline" title="插入换行（Ctrl+Enter）" data-i18n-title="插入换行（Ctrl+Enter）">↵</button>
          </span>
          <span class="fb-rep-btns">
            <button class="fb" id="findReplaceOne" title="替换这一处（Enter）" data-i18n-title="替换这一处（Enter）" data-i18n="替换">替换</button>
            <button class="fb" id="findReplaceAll" title="全部替换（Alt+A）" data-i18n-title="全部替换（Alt+A）" data-i18n="全部">全部</button>
          </span>
        </div>
      </div>

      <div class="edit-wrap" id="editWrap">
        <!-- 纯文本 / 代码编辑区：CodeMirror 6 挂在这里（见 js/editor/plain-editor.js）。
             行号、当前行高亮、语法着色都由它自己管，所以这里不再有 linegutter -->
        <div id="editor" class="plain-host"></div>
        <div id="wysiwyg" class="wysiwyg hidden" contenteditable="true" spellcheck="false"></div>

        <!-- 行首块手柄：放在编辑流之外，浏览器选不中、退格删不到。
             位置由 app.js 按当前块的行盒算，left 落在 .wysiwyg 的左侧留白里 -->
        <div class="w-handle hidden" id="wHandle">
          <button class="wh-btn" id="whAdd" tabindex="-1" title="在下方插入" data-i18n-title="在下方插入"><svg class="ico" aria-hidden="true"><use href="#i-plus" /></svg></button>
          <button class="wh-btn wh-grip" id="whMenu" tabindex="-1" title="块类型" data-i18n-title="块类型"><svg class="ico" aria-hidden="true"><use href="#i-grip-vertical" /></svg></button>
        </div>
      </div>
    </section>

    <div class="splitter" id="midSplitter"></div>

    <section class="preview-pane" id="previewPane">
      <div class="preview-body" id="preview"></div>
    </section>
  </main>

  <!-- ============ 底部状态栏 ============ -->
  <footer class="statusbar">
    <span class="st-item" id="stPos"></span>
    <span class="st-item" id="stLines"></span>
    <span class="st-item" id="stWords"></span>
    <span class="st-item fmt" id="fmtBadge">Markdown</span>
    <span class="st-spacer"></span>
    <button class="st-btn" id="stEOL" title="切换换行符" data-i18n-title="切换换行符">LF</button>
    <button class="st-btn" id="stEncoding" title="更改编码" data-i18n-title="更改编码">UTF-8</button>
    <span class="st-item" id="stDraft">草稿已同步</span>
  </footer>

  <!-- ============ 独立面板：文本对比 / 文件夹对比 ============ -->
  <div class="overlay hidden" id="overlay">
    <div class="sheet" id="sheet">
      <!-- 文件夹对比（文本对比已搬到独立窗口 compare.html） -->
      <div class="sheet-page" id="pageFolder">
        <div class="sheet-head">
          <div class="sheet-title" data-i18n="文件夹对比">文件夹对比</div>
          <div class="diff-src">
            <div class="src-slot">
              <button class="mini" id="pickFolderLeft" data-i18n="选择文件夹">选择文件夹</button>
              <span class="src-name" id="nameFolderLeft">未选择</span>
            </div>
            <div class="src-slot">
              <button class="mini" id="pickFolderRight" data-i18n="选择文件夹">选择文件夹</button>
              <span class="src-name" id="nameFolderRight">未选择</span>
            </div>
          </div>
          <div class="sheet-actions">
            <label class="chk"><input type="checkbox" id="folderOnlyDiff" checked /> <span data-i18n="只显示差异">只显示差异</span></label>
            <span class="diff-stat" id="folderStat"></span>
            <button class="mini ghost close-sheet" data-i18n="关闭">关闭</button>
          </div>
        </div>
        <div class="folder-body" id="folderBody"></div>
      </div>
    </div>
  </div>

  <!-- ============ 三向合并向导 ============ -->
  <div class="overlay hidden" id="mergeOverlay">
    <div class="modal">
      <div class="modal-head">
        <b data-i18n="三向合并">三向合并</b>
        <button class="mini ghost icon-only" id="mergeClose" title="关闭" data-i18n-title="关闭"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button>
      </div>
      <div class="modal-body">
        <p class="hint" data-i18n="以「基准版本」为共同祖先，把 A、B 两侧的改动自动合并。结果会另存为新文件，不会覆盖任何原文件。">以「基准版本」为共同祖先，把 A、B 两侧的改动自动合并。结果会另存为新文件，不会覆盖任何原文件。</p>
        <div class="merge-row"><span data-i18n="基准版本">基准版本</span><button class="mini" data-pick="base" data-i18n="选择文件">选择文件</button><em id="mergeNameBase">未选择</em></div>
        <div class="merge-row"><span data-i18n="A 侧文件">A 侧文件</span><button class="mini" data-pick="a" data-i18n="选择文件">选择文件</button><em id="mergeNameA">未选择</em></div>
        <div class="merge-row"><span data-i18n="B 侧文件">B 侧文件</span><button class="mini" data-pick="b" data-i18n="选择文件">选择文件</button><em id="mergeNameB">未选择</em></div>
        <div class="merge-result" id="mergeResult"></div>
      </div>
      <div class="modal-foot">
        <button class="mini ghost" id="mergeCancel" data-i18n="取消">取消</button>
        <button class="mini primary" id="mergeRun" data-i18n="开始合并">开始合并</button>
      </div>
    </div>
  </div>

  <!-- ============ 通用对话框 ============ -->
  <div class="overlay hidden" id="dlgOverlay">
    <div class="modal small">
      <div class="modal-head"><b id="dlgTitle">提示</b><button class="mini ghost icon-only" id="dlgClose" title="关闭" data-i18n-title="关闭"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button></div>
      <div class="modal-body"><div id="dlgBody"></div></div>
      <div class="modal-foot" id="dlgFoot"></div>
    </div>
  </div>

  <!-- 块类型菜单：点行首手柄弹出，和顶栏菜单共用同一套命令 -->
  <div class="w-bmenu hidden" id="wBlockMenu" role="menu"></div>

  <div class="toast-wrap" id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
