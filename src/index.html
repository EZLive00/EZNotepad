  <!-- icon-sprite:end -->
  <!-- ============ 顶部：标题栏（菜单 + 标题 + 窗口按钮）｜标签与工具行 ============ -->
  <header class="appbar">
    <div class="titlebar" data-tauri-drag-region>
      <div class="brand" title="简单记事本">
        <span class="brand-mark"><svg class="ico" aria-hidden="true"><use href="#i-notebook-pen" /></svg></span>
      </div>
      <nav class="menubar" id="menubar" aria-label="主菜单"></nav>
      <div class="titlebar-fill" data-tauri-drag-region></div>
      <div class="win-title" id="winTitle" data-tauri-drag-region></div>
      <div class="win-ctrl">
        <button class="wc" id="wcMin" title="最小化" tabindex="-1"><svg class="ico" aria-hidden="true"><use href="#i-minus" /></svg></button>
        <button class="wc" id="wcMax" title="最大化" tabindex="-1"><svg class="ico" id="wcMaxIcon" aria-hidden="true"><use href="#i-square" /></svg></button>
        <button class="wc danger" id="wcClose" title="关闭" tabindex="-1"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button>
      </div>
    </div>

    <div class="tabbar">
      <div class="tabs" id="tabs"></div>
      <button class="tab-add" id="tabAdd" title="新建标签 (Ctrl+T)"><svg class="ico" aria-hidden="true"><use href="#i-plus" /></svg></button>
      <div class="tabbar-fill" data-tauri-drag-region></div>

      <!-- 工具行只留三个高频动作，其余（新建/打开/单栏双栏/大纲/格式化/对比/主题）
           都在菜单里有，且带勾选状态 —— 宁可省行宽，也不重复摆放 -->
      <div class="toolbar" id="toolbar">
        <div class="dropdown" id="modeDropdown">
          <button class="tb" id="btnMode">
            <svg class="ico" id="modeIcon" aria-hidden="true"><use href="#i-code" /></svg><span id="modeLabel">编辑</span><svg class="ico caret" aria-hidden="true"><use href="#i-chevron-down" /></svg>
          </button>
          <div class="menu-panel" id="modeMenu">
            <button data-mode="wysiwyg"><b>所见即所得<svg class="ico menu-check" aria-hidden="true"><use href="#i-check" /></svg></b><small>输入即渲染，富文本体验</small></button>
            <button data-mode="edit"><b>编辑模式<svg class="ico menu-check" aria-hidden="true"><use href="#i-check" /></svg></b><small>显示原始 Markdown / 源码</small></button>
            <button data-mode="preview"><b>预览模式<svg class="ico menu-check" aria-hidden="true"><use href="#i-check" /></svg></b><small>只读，仅查看渲染结果</small></button>
            <div class="menu-note" id="modeNote"></div>
          </div>
        </div>

        <button class="tb icon-only" id="btnFind" title="查找替换 (Ctrl+F)"><svg class="ico" aria-hidden="true"><use href="#i-search" /></svg></button>
        <button class="tb" id="btnSave" title="保存 (Ctrl+S)"><svg class="ico" aria-hidden="true"><use href="#i-save" /></svg><span>保存</span></button>
      </div>
    </div>
  </header>

  <!-- ============ 主区域：大纲 | 编辑 | 预览 ============ -->
  <main class="workspace" id="workspace">
    <aside class="outline" id="outlinePane">
      <div class="pane-head">大纲</div>
      <div class="outline-list" id="outlineList"></div>
    </aside>
    <div class="splitter" id="outlineSplitter"></div>

    <section class="editor-pane" id="editorPane">
      <div class="findbar hidden" id="findbar">
        <input id="findInput" placeholder="查找" spellcheck="false" />
        <input id="replaceInput" class="hidden" placeholder="替换为" spellcheck="false" />
        <span class="find-count" id="findCount">0/0</span>
        <button class="fb icon-only" id="findPrev" title="上一个 (Shift+Enter)"><svg class="ico" aria-hidden="true"><use href="#i-chevron-up" /></svg></button>
        <button class="fb icon-only" id="findNext" title="下一个 (Enter)"><svg class="ico" aria-hidden="true"><use href="#i-chevron-down" /></svg></button>
        <button class="fb" id="findReplaceOne" title="替换">替换</button>
        <button class="fb" id="findReplaceAll" title="全部替换">全部</button>
        <label class="fb-check"><input type="checkbox" id="findCase" /> 区分大小写</label>
        <label class="fb-check"><input type="checkbox" id="findRegex" /> 正则</label>
        <button class="fb close" id="findClose" title="关闭 (Esc)"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button>
      </div>

      <div class="edit-wrap" id="editWrap">
        <!-- 纯文本 / 代码编辑区：CodeMirror 6 挂在这里（见 js/editor/plain-editor.js）。
             行号、当前行高亮、语法着色都由它自己管，所以这里不再有 linegutter -->
        <div id="editor" class="plain-host"></div>
        <div id="wysiwyg" class="wysiwyg hidden" contenteditable="true" spellcheck="false"></div>

        <!-- 行首块手柄：放在编辑流之外，浏览器选不中、退格删不到。
             位置由 app.js 按当前块的行盒算，left 落在 .wysiwyg 的左侧留白里 -->
        <div class="w-handle hidden" id="wHandle">
          <button class="wh-btn" id="whAdd" tabindex="-1" title="在下方插入"><svg class="ico" aria-hidden="true"><use href="#i-plus" /></svg></button>
          <button class="wh-btn" id="whMenu" tabindex="-1" title="块类型"><svg class="ico" aria-hidden="true"><use href="#i-grip-vertical" /></svg></button>
        </div>
      </div>
    </section>

    <div class="splitter" id="midSplitter"></div>

    <section class="preview-pane" id="previewPane">
      <div class="preview-head"><span id="previewHeadText">预览</span></div>
      <div class="preview-body" id="preview"></div>
    </section>
  </main>

  <!-- ============ 底部状态栏 ============ -->
  <footer class="statusbar">
    <span class="st-item" id="stPos">行 1, 列 1</span>
    <span class="st-item" id="stLines">1 行</span>
    <span class="st-item" id="stWords">0 字</span>
    <span class="st-item fmt" id="fmtBadge">Markdown</span>
    <span class="st-spacer"></span>
    <button class="st-btn" id="stEOL" title="切换换行符">LF</button>
    <button class="st-btn" id="stEncoding" title="更改编码">UTF-8</button>
    <span class="st-item" id="stDraft">草稿已同步</span>
  </footer>

  <!-- ============ 独立面板：文本对比 / 文件夹对比 ============ -->
  <div class="overlay hidden" id="overlay">
    <div class="sheet" id="sheet">
      <!-- 文本对比 -->
      <div class="sheet-page hidden" id="pageDiff">
        <div class="sheet-head">
          <div class="sheet-title">文本对比</div>
          <div class="diff-src">
            <div class="src-slot">
              <button class="mini" id="pickLeft">选择文件</button>
              <span class="src-name" id="nameLeft">未选择</span>
            </div>
            <button class="mini ghost icon-only" id="swapDiff" title="交换左右"><svg class="ico" aria-hidden="true"><use href="#i-arrow-left-right" /></svg></button>
            <div class="src-slot">
              <button class="mini" id="pickRight">选择文件</button>
              <span class="src-name" id="nameRight">未选择</span>
            </div>
          </div>
          <div class="sheet-actions">
            <label class="chk"><input type="checkbox" id="diffIgnoreWS" checked /> 忽略空白</label>
            <label class="chk"><input type="checkbox" id="diffIgnoreCase" /> 忽略大小写</label>
            <span class="diff-stat" id="diffStat"></span>
            <button class="mini" id="diffPrev" title="上一处差异 (F7)"><svg class="ico" aria-hidden="true"><use href="#i-chevron-up" /></svg>上一处</button>
            <button class="mini" id="diffNext" title="下一处差异 (F8)"><svg class="ico" aria-hidden="true"><use href="#i-chevron-down" /></svg>下一处</button>
            <button class="mini primary" id="diffSaveReport">导出报告</button>
            <button class="mini ghost close-sheet">关闭</button>
          </div>
        </div>
        <div class="diff-body" id="diffBody"></div>
      </div>

      <!-- 文件夹对比 -->
      <div class="sheet-page hidden" id="pageFolder">
        <div class="sheet-head">
          <div class="sheet-title">文件夹对比</div>
          <div class="diff-src">
            <div class="src-slot">
              <button class="mini" id="pickFolderLeft">选择文件夹</button>
              <span class="src-name" id="nameFolderLeft">未选择</span>
            </div>
            <div class="src-slot">
              <button class="mini" id="pickFolderRight">选择文件夹</button>
              <span class="src-name" id="nameFolderRight">未选择</span>
            </div>
          </div>
          <div class="sheet-actions">
            <label class="chk"><input type="checkbox" id="folderOnlyDiff" checked /> 只显示差异</label>
            <span class="diff-stat" id="folderStat"></span>
            <button class="mini ghost close-sheet">关闭</button>
          </div>
        </div>
        <div class="folder-body" id="folderBody"></div>
      </div>

      <!-- 对比中心首页 -->
      <div class="sheet-page" id="pageHub">
        <div class="sheet-head">
          <div class="sheet-title">对比中心</div>
          <div class="sheet-actions"><button class="mini ghost close-sheet">关闭</button></div>
        </div>
        <div class="hub">
          <button class="hub-card" id="hubText">
            <span class="hub-icon"><svg class="ico" aria-hidden="true"><use href="#i-file-diff" /></svg></span>
            <b>文本对比</b>
            <small>两个文件并排比对，差异高亮，可左右同步</small>
          </button>
          <button class="hub-card" id="hubFolder">
            <span class="hub-icon"><svg class="ico" aria-hidden="true"><use href="#i-folders" /></svg></span>
            <b>文件夹对比</b>
            <small>递归比两个目录，列出新增 / 删除 / 修改</small>
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============ 三向合并向导 ============ -->
  <div class="overlay hidden" id="mergeOverlay">
    <div class="modal">
      <div class="modal-head">
        <b>三向合并</b>
        <button class="mini ghost icon-only" id="mergeClose" title="关闭"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button>
      </div>
      <div class="modal-body">
        <p class="hint">以「基准版本」为共同祖先，把 A、B 两侧的改动自动合并。结果会另存为新文件，不会覆盖任何原文件。</p>
        <div class="merge-row"><span>基准版本</span><button class="mini" data-pick="base">选择文件</button><em id="mergeNameBase">未选择</em></div>
        <div class="merge-row"><span>A 侧文件</span><button class="mini" data-pick="a">选择文件</button><em id="mergeNameA">未选择</em></div>
        <div class="merge-row"><span>B 侧文件</span><button class="mini" data-pick="b">选择文件</button><em id="mergeNameB">未选择</em></div>
        <div class="merge-result" id="mergeResult"></div>
      </div>
      <div class="modal-foot">
        <button class="mini ghost" id="mergeCancel">取消</button>
        <button class="mini primary" id="mergeRun">开始合并</button>
      </div>
    </div>
  </div>

  <!-- ============ 通用对话框 ============ -->
  <div class="overlay hidden" id="dlgOverlay">
    <div class="modal small">
      <div class="modal-head"><b id="dlgTitle">提示</b><button class="mini ghost icon-only" id="dlgClose" title="关闭"><svg class="ico" aria-hidden="true"><use href="#i-x" /></svg></button></div>
      <div class="modal-body"><div id="dlgBody"></div></div>
      <div class="modal-foot" id="dlgFoot"></div>
    </div>
  </div>

  <!-- 块类型菜单：点行首手柄弹出，和顶栏菜单共用同一套命令 -->
  <div class="w-bmenu hidden" id="wBlockMenu" role="menu"></div>

  <div class="toast-wrap" id="toasts"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
