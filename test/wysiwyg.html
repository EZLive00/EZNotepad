<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>wysiwyg 内核测试</title>
<link rel="stylesheet" href="../src/styles.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body { display: block; overflow: auto; user-select: auto; }
  #wysiwyg { min-height: 300px; }
</style>
</head>
<body data-theme="light">
<div id="wysiwyg" class="wysiwyg" contenteditable="true" spellcheck="false"></div>
<script type="module">
import { WysiwygEditor } from '../src/js/wysiwyg.js';
import { renderMarkdown } from './../src/js/markdown.js';
import * as df from '../src/js/domfind.js';

const root = document.getElementById('wysiwyg');
let out = '';
const ed = new WysiwygEditor(root, { onChange: (m) => { out = m; } });
window.__ed = ed;

const T = {
  reset(src) {
    root.focus();
    ed.render(src);
    out = ed.toMarkdown();
    root.focus();
    ed.restoreCaret({ blockIndex: 0, offset: 0 });
    return out;
  },
  out: () => ed.toMarkdown(),
  caret(i, off) { root.focus(); ed.restoreCaret({ blockIndex: i, offset: off }); return ed.caretState(); },
  type(s) { document.execCommand('insertText', false, s); return ed.toMarkdown(); },
  key(k, o = {}) {
    root.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...o }));
    return ed.toMarkdown();
  },
  blocks: () => [...root.children].map((b) => {
    const t = (b.querySelector('.w-text') || b.querySelector('td') || b).textContent;
    const li = b.dataset.type === 'li' ? `:${b.dataset.list}` : '';
    const ind = b.dataset.indent ? '@' + b.dataset.indent : '';
    return `${b.dataset.type}${li}${ind}=${t}`;
  }),
  cells: () => [...root.querySelectorAll('table tr')].map((tr) => [...tr.children].map((c) => c.textContent).join('|')),
  undo() { ed.undo(); return ed.toMarkdown(); },
};

window.T = T;

window.__run = () => {
  const R = [];
  const eq = (name, got, want) => R.push({ name, ok: String(got) === String(want), got: String(got), want: String(want) });
  const has = (name, ok) => R.push({ name, ok: !!ok, got: String(!!ok), want: 'true' });

  // 1. 往返保真
  const SRC = [
    '# 标题',
    '',
    '普通 **粗体** 与 _斜体_ 和 `code`。',
    '',
    '- 项目一',
    '- 项目二',
    '  - 子项 A',
    '1. 第一',
    '2. 第二',
    '',
    '> 引用一行',
    '',
    '| 名称 | 数量 |',
    '| --- | ---: |',
    '| 苹果 | 3 |',
    '',
    '```js',
    'const a = 1;',
    '```',
    '',
    '---',
  ].join('\n');
  eq('往返保真', T.reset(SRC), SRC);

  // 1b. 图片：Markdown 里存相对路径，DOM 里用 data-src 记住原值
  T.reset('![图](assets/a.png)');
  eq('图片相对路径往返不丢', T.out(), '![图](assets/a.png)');
  eq('img 保留原始地址', root.querySelector('img').getAttribute('data-src'), 'assets/a.png');
  T.reset('![网图](https://example.com/x.png)');
  eq('网络图片原样', T.out(), '![网图](https://example.com/x.png)');

  // 2. 段首语法糖
  T.reset('');
  T.type('- ');
  eq('输入 "- " 变无序列表', T.blocks()[0], 'li:ul@0=');
  T.type('一');
  T.key('Enter');
  T.type('二');
  eq('列表内回车接着编号', T.out(), '- 一\n- 二');

  // 3. 空列表项回车退出
  T.key('Enter');
  eq('空项回车先清标记', T.blocks().length, 3);
  T.key('Enter');
  eq('再回车退出列表', T.blocks()[2].startsWith('p'), true);

  // 2b. 已有文字前面补标记（光标在文字前，不是行尾）
  T.reset('已经写好的文字');
  T.caret(0, 0);
  T.type('## ');
  eq('文字前面输入 "## " 变二级标题', T.blocks()[0], 'h2=已经写好的文字');
  eq('光标停在标题文字前面', ed.caretState().offset, 0);
  T.type('新的');
  eq('接着输入落在文字前面', T.out(), '## 新的已经写好的文字');

  T.reset('**粗体**和 `码`');
  T.caret(0, 0);
  T.type('### ');
  eq('搬移后半段不丢行内样式', T.out(), '### **粗体**和 `码`');

  T.reset('引用内容');
  T.caret(0, 0);
  T.type('> ');
  eq('文字前面输入 "> " 变引用', T.out(), '> 引用内容');

  T.reset('第一项内容');
  T.caret(0, 0);
  T.type('1. ');
  eq('文字前面输入 "1. " 变有序列表', T.out(), '1. 第一项内容');

  T.reset('待办事项');
  T.caret(0, 0);
  T.type('- [ ] ');
  eq('文字前面输入 "- [ ] " 变任务项', T.blocks()[0], 'li:task@0=待办事项');

  T.reset('const a = 1;');
  T.caret(0, 0);
  T.type('```js ');
  eq('文字前面输入 ``` 变代码块', T.out(), '```js\nconst a = 1;\n```');

  T.reset('第一行\n\n第二行');
  T.caret(1, 0);
  T.type('## ');
  eq('只影响光标那一行', T.out(), '第一行\n\n## 第二行');

  T.reset('文字');
  T.caret(0, 0);
  T.type('##');
  eq('只打 "##" 不带空格不变标题', T.blocks()[0], 'p=##文字');

  T.reset('abc def');
  T.caret(0, 3);
  T.type('- ');
  has('行中间输入 "- " 不触发', T.blocks().length === 1 && T.blocks()[0].startsWith('p'));

  // 4. Tab / Shift+Tab
  T.reset('- a\n- b');
  T.caret(1, 3);
  T.key('Tab');
  eq('Tab 缩进一级', T.out(), '- a\n  - b');
  T.key('Tab', { shiftKey: true });
  eq('Shift+Tab 退一级', T.out(), '- a\n- b');
  T.key('Tab', { shiftKey: true });
  eq('顶层再退变段落', T.out(), '- a\n\nb');

  // 5. 退格：列表项开头
  T.reset('- a\n  - b');
  T.caret(1, 0);
  T.key('Backspace');
  eq('缩进项退格退一级', T.out(), '- a\n- b');
  T.caret(1, 0);
  T.key('Backspace');
  eq('顶层列表项退格变段落', T.out(), '- a\n\nb');

  // 6. 有序列表重排
  T.reset('1. 甲\n2. 乙');
  T.caret(0, 2);
  T.key('Enter');
  T.type('丙');
  eq('中间插入自动重排', T.out(), '1. 甲\n2. 丙\n3. 乙');

  // 7. 引用
  T.reset('> 引用');
  T.caret(0, 2);
  T.key('Enter');
  T.type('续行');
  eq('引用内回车继续引用', T.out(), '> 引用\n> 续行');

  // 8. 表格
  T.reset('');
  ed.insertTable(3, 3);
  eq('插入 3x3 表格', T.out(), '|  |  |  |\n| --- | --- | --- |\n|  |  |  |\n|  |  |  |');
  T.type('名称');
  T.key('Tab');
  T.type('数量');
  T.key('Tab');
  T.type('备注');
  eq('Tab 在单元格间移动', T.cells()[0], '名称|数量|备注');
  T.key('Tab');
  T.type('一级');
  eq('第 3 次 Tab 落到下一行首列', T.cells()[1], '一级||');
  T.key('Enter');
  T.type('苹果');
  eq('回车换到下一行同列', T.cells()[2], '苹果||');
  has('表格 Markdown 带表头', T.out().split('\n').some((l) => l.startsWith('| 苹果 |')));

  // 9. 行内自动转换
  T.reset('');
  T.type('**粗**');
  eq('粗体标记转换', T.out(), '**粗**');
  has('确实生成了 strong', root.querySelector('strong'));
  T.type(' 尾');
  eq('粗体后继续输入', T.out(), '**粗** 尾');

  // 10. 行内样式不丢（回归）
  T.reset('**粗** 普通');
  T.caret(0, 6);
  T.type('!');
  eq('编辑后粗体标记仍在', T.out(), '**粗** 普通!');

  // 11. 删除合并
  T.reset('abc\ndef');
  T.caret(0, 3);
  T.key('Delete');
  eq('行尾 Delete 合并下一行', T.out(), 'abcdef');

  T.reset('abc\ndef');
  T.caret(1, 0);
  T.key('Backspace');
  eq('行首 Backspace 并入上一行', T.out(), 'abcdef');

  // 12. 标题：回车后变正文
  T.reset('# 标题');
  T.caret(0, 4);
  T.key('Enter');
  T.type('正文');
  eq('标题内回车后是新段落', T.out(), '# 标题\n\n正文');

  // 13. 撤销
  T.reset('');
  T.type('abc');
  T.undo();
  eq('撤销回到空', T.out(), '');

  // 14. 任务列表
  T.reset('- [ ] 待办\n- [x] 完成');
  eq('任务列表往返', T.out(), '- [ ] 待办\n- [x] 完成');
  root.querySelectorAll('.w-check')[0].click();
  eq('点勾选框写回 Markdown', T.out(), '- [x] 待办\n- [x] 完成');

  // 15. 列表 / 标题切换
  T.reset('一段文字');
  T.caret(0, 0);
  ed.toggleList('ul');
  eq('段落转无序列表', T.out(), '- 一段文字');
  ed.toggleList('ul');
  eq('再点一次取消列表', T.out(), '一段文字');
  ed.toggleHeading(2);
  eq('转二级标题', T.out(), '## 一段文字');
  ed.toggleHeading(2);
  eq('再点一次回正文', T.out(), '一段文字');

  // 16. 表格行列增删
  T.reset('');
  ed.insertTable(2, 2);
  T.type('A');
  T.key('Tab');
  T.type('B');
  T.key('Tab');
  ed.tableCommand('rowBelow');
  eq('表格加一行', T.cells().length, 3);
  ed.tableCommand('delRow');
  eq('表格删一行', T.cells().length, 2);
  ed.focusCell(root.querySelector('.w-block'), 0, 1);
  ed.tableCommand('colAfter');
  eq('表格加一列', T.cells()[0], 'A|B|');
  ed.focusCell(root.querySelector('.w-block'), 0, 2);
  ed.tableCommand('delCol');
  eq('表格删一列', T.cells()[0], 'A|B');
  eq('表格 Markdown', T.out(), '| A | B |\n| --- | --- |\n|  |  |');

  // 17. 撤销结构操作
  T.reset('- a\n- b');
  T.caret(1, 3);
  T.key('Tab');
  eq('缩进生效', T.out(), '- a\n  - b');
  T.undo();
  eq('撤销缩进', T.out(), '- a\n- b');

  // 18. 多行粘贴按 Markdown 解析
  T.reset('');
  T.caret(0, 0);
  const dt = new DataTransfer();
  dt.setData('text/plain', '## 小标题\n- 甲\n- 乙');
  root.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
  eq('多行粘贴保留结构', T.out(), '## 小标题\n\n- 甲\n- 乙');

  // 19. 代码块内回车
  T.reset('```js\nconst a = 1;\n```');
  ed.restoreCaret({ blockIndex: 0, offset: 12 });
  T.key('Enter');
  T.type('const b = 2;');
  eq('代码块回车换行', T.out(), '```js\nconst a = 1;\nconst b = 2;\n```');

  // 20. 四空格缩进的嵌套列表：结构要读对（序列化会规范化列宽）
  T.reset('- 父\n    - 子');
  eq('四空格缩进识别为一级子项', T.blocks()[1], 'li:ul@1=子');

  // 21. 空行只是块间分隔，不是空段落
  T.reset('a\n\nb');
  eq('空行不生成空块', T.blocks().join(','), 'p=a,p=b');
  T.caret(1, 0);
  T.key('Backspace');
  eq('行首退格并入上一块', T.out(), 'ab');

  // 22. 行内码切换
  T.reset('text');
  ed.restoreCaret({ blockIndex: 0, offset: 0 });
  const rng = document.createRange();
  rng.setStart(root.querySelector('.w-text').firstChild, 0);
  rng.setEnd(root.querySelector('.w-text').firstChild, 4);
  const s2 = getSelection();
  s2.removeAllRanges();
  s2.addRange(rng);
  ed.toggleInline('code');
  eq('行内码包裹选区', T.out(), '`text`');

  // 23. 表格列对齐：写进 data-aligns 并体现在分隔行
  T.reset('| a | b |\n|---|---|\n| 1 | 2 |');
  ed.focusCell(root.querySelector('.w-table'), 1, 1);
  ed.setColAlign('center');
  eq('列居中写入 Markdown', T.out(), '| a | b |\n| --- | :---: |\n| 1 | 2 |');
  T.reset(T.out());
  eq('列居中往返保留', root.querySelector('tbody td:nth-child(2)').style.textAlign, 'center');
  ed.focusCell(root.querySelector('.w-table'), 0, 0);
  ed.setColAlign('right');
  eq('表头列也能右对齐', T.out(), '| a | b |\n| ---: | :---: |\n| 1 | 2 |');

  // 24. 三级嵌套有序列表 + 编号
  T.reset('1. a\n   1. b\n2. c');
  eq('嵌套有序列表结构', T.blocks().join(','), 'li:ol@0=a,li:ol@1=b,li:ol@0=c');
  eq('嵌套有序列表列宽', T.out(), '1. a\n   1. b\n2. c');

  // 25. 选区离开编辑区后仍能定位当前块（菜单/工具栏点击时不丢目标）
  T.reset('alpha\nbeta');
  ed.restoreCaret({ blockIndex: 1, offset: 2 });
  const blk = ed.currentBlock();
  getSelection().collapse(document.body, 0);
  has('选区离开后 currentBlock 兜底', ed.currentBlock() === blk);

  // 26. 段落 → 引用
  T.reset('引用这段');
  ed.restoreCaret({ blockIndex: 0, offset: 0 });
  ed.insertBlock('quote');
  eq('段落转引用', T.out(), '> 引用这段');

  // 27. 预览渲染器：嵌套列表 / 表格对齐 / 任务清单
  const prev = renderMarkdown('- 一级\n  - 二级\n    1. 三级有序\n- 一级b\n\n| l | c |\n| :-- | :-: |\n| 1 | 2 |\n\n- [x] 完成\n- [ ] 未完成\n');
  has('预览：嵌套列表结构', prev.includes('<ul><li>一级<ul><li>二级<ol><li>三级有序</li></ol></li></ul></li><li>一级b</li></ul>'));
  has('预览：表格对齐', prev.includes('<th style="text-align:left">l</th>') && prev.includes('<td style="text-align:center">2</td>'));
  has('预览：任务清单', prev.includes('<ul class="task-list">') && prev.includes('checked'));

  // 28. 输入 --- 变分割线
  T.reset('');
  T.type('---');
  eq('输入 --- 变分割线', T.blocks().join(','), 'hr=,p=');

  // 29. 表格落在文档末尾时自动补一个空段落当落脚点
  T.reset('abc');
  ed.restoreCaret({ blockIndex: 0, offset: 3 });
  ed.insertTable(2, 2);
  eq('表格后补空段落', T.blocks().length, 3);
  eq('空段落排在表格之后', T.blocks()[2], 'p=');
  has('末尾空段落不写进 Markdown', !T.out().endsWith('\n'));

  // 30. 光标离开表格后，表格命令立刻失效
  T.reset('| a | b |\n|---|---|\n| 1 | 2 |\n\n正文');
  ed.focusCell(root.querySelector('.w-table'), 1, 1);
  has('单元格里 isInTable 为真', ed.isInTable());
  ed.restoreCaret({ blockIndex: 1, offset: 1 });
  has('回到正文后 isInTable 为假', !ed.isInTable());

  // 31. 空行上插入代码块不留空段落；引用可以再点一次取消
  T.reset('');
  ed.insertBlock('code');
  eq('空行上插代码块不残留空段落', T.blocks().join(','), 'code=');
  T.reset('一段话');
  ed.restoreCaret({ blockIndex: 0, offset: 0 });
  ed.insertBlock('quote');
  eq('段落转引用', T.out(), '> 一段话');
  ed.insertBlock('quote');
  eq('再点一次取消引用', T.out(), '一段话');

  // 32. 空行不再生成空段落：标题与分割线之间只隔一层
  T.reset('## 标题\n\n---');
  eq('标题与分割线之间没有空块', T.blocks().join(','), 'h2=标题,hr=');
  eq('空行往返不变', T.out(), '## 标题\n\n---');

  T.reset('## 标题\n\n正文');
  eq('标题与正文之间没有空块', T.blocks().join(','), 'h2=标题,p=正文');

  // 连续两个空行是用户手打出来的空档，仍然保留
  T.reset('a\n\n\nb');
  eq('两个空行保留', T.out(), 'a\n\n\nb');
  eq('第二个空行是个空块', T.blocks().join(','), 'p=a,p=,p=b');

  // 33. 删空标题：块立刻退回正文（否则会留下一条没有文字的装饰线，打字还是标题）
  T.reset('## 标题');
  T.caret(0, 0);
  const rh = document.createRange();
  rh.selectNodeContents(root.querySelector('.w-text'));
  getSelection().removeAllRanges();
  getSelection().addRange(rh);
  document.execCommand('delete');
  eq('标题文字删空后立刻变正文', T.blocks()[0], 'p=');
  has('删空的块里没有游离 <br>', ![...root.children[0].childNodes].some((n) => n.nodeName === 'BR'));
  T.type('新内容');
  eq('删空标题后重写是普通段落', T.out(), '新内容');

  // 33b. 标题 + 分割线：删空标题不该把分割线挤下去，也不该把 ## 写回文件
  T.reset('## 标题\n\n---\n\n正文');
  T.caret(0, 0);
  const rh2 = document.createRange();
  rh2.selectNodeContents(root.querySelector('.w-text'));
  getSelection().removeAllRanges();
  getSelection().addRange(rh2);
  document.execCommand('delete');
  eq('删空标题后分割线原地不动', T.blocks().join(','), 'p=,hr=,p=正文');
  eq('删空标题后回写不留 ##', T.out(), '---\n\n正文');

  // 33c. 空标题里回车 = 退出标题，接着写的是正文
  T.reset('');
  T.caret(0, 0);
  T.type('## ');
  eq('输入 ## 空格得到空标题', T.blocks()[0], 'h2=');
  T.key('Enter');
  eq('空标题里回车退回正文', T.blocks()[0], 'p=');

  // 33d. 文件里遗留的空标题（## 后面什么都没有）载入时也退回正文
  T.reset('## \n\n正文');
  eq('载入时空标题退回正文', T.blocks().join(','), 'p=,p=正文');

  // 33e. 段落里同样不该留游离 <br>（删除整行文字后块会凭空高出一行）
  T.reset('一个段落');
  T.caret(0, 0);
  const rp = document.createRange();
  rp.selectNodeContents(root.querySelector('.w-text'));
  getSelection().removeAllRanges();
  getSelection().addRange(rp);
  document.execCommand('delete');
  has('段落删空后没有游离 <br>', ![...root.children[0].childNodes].some((n) => n.nodeName === 'BR'));
  eq('段落删空后高度只有一行', root.children[0].getBoundingClientRect().height < 40, true);

  // 33f. 用菜单把空行设成标题、还没打字时，别处敲字不该把这个标题悄悄吃掉
  T.reset('甲\n\n乙');
  T.caret(1, 1);
  const re2 = document.createRange();
  re2.selectNodeContents(root.children[1].querySelector('.w-text'));
  getSelection().removeAllRanges();
  getSelection().addRange(re2);
  document.execCommand('delete');
  window.__ed.restoreCaret({ blockIndex: 1, offset: 0 });
  window.__ed.toggleHeading(2);
  eq('菜单把空行设成二级标题', T.blocks()[1], 'h2=');
  T.caret(0, 1);
  T.type('字');
  eq('别处敲字不影响这个空标题', T.blocks()[1], 'h2=');

  // 34. 标题行首退格：先亮出 ###，再一级一级退，绝不一步砍掉标题
  T.reset('前言\n\n## 标题\n\n正文');
  T.caret(1, 0);
  T.key('Backspace');
  eq('一次退格：标题还是标题', T.blocks()[1], 'h2=标题');
  eq('一次退格：亮出 ##', root.querySelector('.w-hash').textContent, '##');
  eq('一次退格：文件一个字没变', T.out(), '前言\n\n## 标题\n\n正文');
  T.key('Backspace');
  eq('二次退格：降为一级标题', T.blocks()[1], 'h1=标题');
  eq('标记跟着变短', root.querySelector('.w-hash').textContent, '#');
  eq('降级写回文件', T.out(), '前言\n\n# 标题\n\n正文');
  T.key('Backspace');
  eq('三次退格：退回正文', T.blocks()[1], 'p=标题');
  eq('标记已收走', root.querySelector('.w-hash'), null);
  eq('正文写回文件', T.out(), '前言\n\n标题\n\n正文');
  T.key('Backspace');
  eq('再退格才和上一块合并', T.blocks().join(','), 'p=前言标题,p=正文');

  // 34b. 空标题（还没写字）也一样：先亮标记，不把整行删掉
  T.reset('甲\n\n乙');
  T.caret(1, 0);
  const r9 = document.createRange();
  r9.selectNodeContents(root.children[1].querySelector('.w-text'));
  getSelection().removeAllRanges();
  getSelection().addRange(r9);
  document.execCommand('delete');
  window.__ed.restoreCaret({ blockIndex: 1, offset: 0 });
  window.__ed.toggleHeading(3);
  eq('空行设成三级标题', T.blocks()[1], 'h3=');
  T.key('Backspace');
  eq('空标题退格不删行', T.blocks()[1], 'h3=');
  eq('空标题亮出 ###', root.querySelector('.w-hash').textContent, '###');
  T.key('Backspace');
  eq('空标题降为二级', T.blocks()[1], 'h2=');

  // 34c. 回车 / 光标离开时标记自动收起，级别不受影响
  T.reset('## 标题');
  T.caret(0, 0);
  T.key('Backspace');
  has('亮出标记', !!root.querySelector('.w-hash'));
  T.caret(0, 2);
  T.key('Enter');
  eq('回车后标题还在、下一行是正文', T.blocks().join(','), 'h2=标题,p=');
  has('回车收走标记', !root.querySelector('.w-hash'));

  T.reset('## 标题\n\n正文');
  T.caret(0, 0);
  T.key('Backspace');
  has('亮出标记（第二处）', !!root.querySelector('.w-hash'));
  T.caret(1, 0);
  document.dispatchEvent(new Event('selectionchange'));
  has('光标离开后标记收起', !root.querySelector('.w-hash'));
  eq('标题级别不受影响', T.blocks().join(','), 'h2=标题,p=正文');

  // ---- domfind：在渲染结果里查字（所见即所得的原位查找）----
  T.reset('# 标题一\n\n正文里有标题两个字，还有一个**加粗的标题**。\n\n- 列表项里的标题\n\n```js\nconst a = 1; // 标题\n```');
  const dm = df.findInDom(root, /标题/g);
  eq('找到 5 处「标题」（标题块/正文/加粗/列表/代码）', dm.length, 5);
  eq('第一处落在标题块', dm[0].block.dataset.type, 'h1');
  eq('第一处还原成 Range 后就是「标题」', df.rangeFor(dm[0]).toString(), '标题');
  has('加粗里的字也能找到', dm.some((m) => df.rangeFor(m).toString() === '标题' && m.block.textContent.includes('加粗')));
  has('代码块里的字也能找到', dm.some((m) => m.block.dataset.type === 'code'));

  const span = df.findInDom(root, /个加粗/g);
  eq('跨行内标签的匹配能还原成 Range', span.length ? df.rangeFor(span[0]).toString() : '（没找到）', '个加粗');

  // 33. 提示块（callout）：> [!info] 扩展引用
  T.reset('> [!warning] 注意\n> 正文行');
  eq('提示块往返不丢', T.out(), '> [!warning] 注意\n> 正文行');
  eq('解析出类型标记', root.children[0].dataset.callout, 'warning');
  eq('自定义标题进标题行', root.querySelector('.w-co-head span').textContent, '注意');
  eq('标记不进正文文字', root.children[0].querySelector('.w-text').textContent, '');
  T.reset('> [!NOTE]\n内容');
  eq('GitHub 别名归一', T.out(), '> [!info]\n\n内容');   // 「内容」不在引用里，是独立段落
  eq('无标题用默认标签', root.querySelector('.w-co-head span').textContent, '信息');

  T.reset('');
  T.type('[!danger] ');
  eq('输入 [!danger] 空格变提示块', root.children[0].dataset.callout, 'danger');
  T.type('危险说明');
  eq('标记后的文字进正文（引用第二行）', T.out(), '> [!danger]\n> 危险说明');

  T.reset('一段话');
  ed.setCallout('success');
  eq('段落原地转提示块', T.out(), '> [!success]\n> 一段话');
  ed.setCallout('success');
  eq('再点一次退回普通引用', T.out(), '> 一段话');
  ed.setCallout('info');
  eq('普通引用可再升级', T.out(), '> [!info]\n> 一段话');

  T.reset('> [!info] 一\n> 内容A\n\n> [!warning] 二\n> 内容B');
  eq('相邻提示块之间保持空行（否则预览会连成一块）', T.out(), '> [!info] 一\n> 内容A\n\n> [!warning] 二\n> 内容B');
  T.reset('> [!info] 标题\n> 正文一\n> 正文二');
  eq('提示块正文续行不拆块', T.out(), '> [!info] 标题\n> 正文一\n> 正文二');

  // 34. 查找里的假匹配回归（搜「尾开」不该跨块命中）
  T.reset('甲结尾\n\n开头乙');
  eq('不会跨块拼出假匹配', df.findInDom(root, /尾开/g).length, 0);

  // 高亮：CSS Custom Highlight 是渲染层的东西，DOM 结构不能被改动
  const before = root.innerHTML;
  df.paint(dm, 1);
  has('当前匹配注册了高亮', !!CSS.highlights.get('sn-find-cur'));
  has('全部匹配注册了高亮', !!CSS.highlights.get('sn-find'));
  eq('画高亮不改动 DOM', root.innerHTML === before, 'true');
  df.clear();
  has('清除后没有残留', !CSS.highlights.get('sn-find') && !CSS.highlights.get('sn-find-cur'));

  return R;
};

window.__ready = true;
</script>
</body>
</html>
