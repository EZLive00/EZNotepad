<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<title>wysiwyg 内核测试</title>
<link rel="stylesheet" href="../src/styles.css" />
<style>
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--fg); }
  body { display: block; overflow: auto; user-select: auto; }
  /* 给编辑器真实的高度约束：视口渲染靠 clientHeight 算窗口，
     元素不限高时 clientHeight 会等于全文高度（见 _viewportH 的注释）。
     用行内样式写到元素上，免得被 styles.css 的 flex 规则盖掉 */
</style>
</head>
<body data-theme="light">
<div id="wysiwyg" class="wysiwyg" contenteditable="true" spellcheck="false" style="height: 600px; overflow-y: auto"></div>
<script type="module">
import { WysiwygEditor, blocksToMarkdown } from '../src/js/wysiwyg.js';
import { renderMarkdown } from './../src/js/markdown.js';
import { refreshCode } from '../src/js/codehilite.js';
import * as df from '../src/js/domfind.js';

const root = document.getElementById('wysiwyg');
let out = '';
const ed = new WysiwygEditor(root, { onChange: (m) => { out = m; } });
window.__ed = ed;

const T = {
  reset(src) {
    root.focus();
    ed.render(src);
    out = ed.toMarkdown();
    root.focus();
    ed.restoreCaret({ blockIndex: 0, offset: 0 });
    return out;
  },
  out: () => ed.toMarkdown(),
  caret(i, off) { root.focus(); ed.restoreCaret({ blockIndex: i, offset: off }); return ed.caretState(); },
  type(s) { document.execCommand('insertText', false, s); return ed.toMarkdown(); },
  key(k, o = {}) {
    root.dispatchEvent(new KeyboardEvent('keydown', { key: k, bubbles: true, cancelable: true, ...o }));
    return ed.toMarkdown();
  },
  /* 模拟「点最后一个块下方的空白」。按坐标问命中，所以点必须真的落在
     最后一块下方；老写法固定 clientY=100，块一多就落在字上，测的其实是
     「点了一个段落」。 */
  clickRootBelow() {
    const last = root.lastElementChild;
    const rr = root.getBoundingClientRect();
    const bottom = last ? last.getBoundingClientRect().bottom : rr.top;
    const y = Math.min(bottom + 24, rr.bottom - 4);
    root.dispatchEvent(new MouseEvent('click', { bubbles: true, cancelable: true, clientX: 3, clientY: y }));
    return ed.toMarkdown();
  },
  /* 模拟「鼠标挪到最后一个块下方的空白」，返回插入指示线的显示状态 */
  hoverBelow() {
    const last = root.lastElementChild;
    const rr = root.getBoundingClientRect();
    const bottom = last ? last.getBoundingClientRect().bottom : rr.top;
    const y = Math.min(bottom + 24, rr.bottom - 4);
    root.dispatchEvent(new MouseEvent('pointermove', { bubbles: true, clientX: 3, clientY: y }));
    return ed.insertLine.style.display;
  },
  /* 粘贴：走真实的 paste 事件，handler 从 selection 取光标，target 是谁都一样 */
  paste(text) {
    const dt = new DataTransfer();
    dt.setData('text/plain', text);
    root.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
    return ed.toMarkdown();
  },
  selBlocks() {
    const s = getSelection();
    if (!s.rangeCount) return 0;
    const r = s.getRangeAt(0);
    return [...root.querySelectorAll('.w-block')].filter((b) => r.intersectsNode(b)).length;
  },
  blocks: () => [...root.children].map((b) => {
    const t = (b.querySelector('.w-text') || b.querySelector('td') || b).textContent;
    const li = b.dataset.type === 'li' ? `:${b.dataset.list}` : '';
    const ind = b.dataset.indent ? '@' + b.dataset.indent : '';
    return `${b.dataset.type}${li}${ind}=${t}`;
  }),
  cells: () => [...root.querySelectorAll('table tr')].map((tr) => [...tr.children].map((c) => c.textContent).join('|')),
  undo() { ed.undo(); return ed.toMarkdown(); },
};

window.T = T;

window.__run = () => {
  const R = [];
  const eq = (name, got, want) => R.push({ name, ok: String(got) === String(want), got: String(got), want: String(want) });
  const has = (name, ok) => R.push({ name, ok: !!ok, got: String(!!ok), want: 'true' });
  /* 把光标摆到「整个块的最后一个字符之后」：表格取最后一格，代码块取末行。
     表格的 textContent 是各格拼起来的，restoreCaret 的块内偏移量落不进格子，
     所以这里直接按 DOM 摆 */
  const caretEndOf = (sel) => {
    const all = [...root.querySelectorAll(sel)];
    const el = all[all.length - 1];
    if (!el) return;
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
    root.focus();
  };
  /* 和上面一样，但如果末尾垫着零宽空格就退回一个字符 —— 这才是用户眼睛看到的
     「最后一个字符之后」。caretEndOf 落在零宽空格之后，测不出「要按两次」那个坑 */
  const caretBeforeTrailingZWSP = (sel) => {
    const all = [...root.querySelectorAll(sel)];
    const el = all[all.length - 1];
    if (!el) return;
    const r = document.createRange();
    r.selectNodeContents(el);
    r.collapse(false);
    const s = getSelection();
    s.removeAllRanges();
    s.addRange(r);
    if (s.focusNode && s.focusNode.nodeType === 3 && s.focusNode.nodeValue[s.focusOffset - 1] === '\u200b') {
      s.collapse(s.focusNode, s.focusOffset - 1);
    }
    root.focus();
  };

  // 增量序列化：flush 的结果必须与全量现算完全一致（缓存脏块判定不能漏）
  T.reset('# 甲\n\n段落 **加粗** 与 `代码`。\n\n- 列表项\n- 第二项\n\n> 引用\n\n| A | B |\n| --- | --- |\n| 1 | 2 |');
  T.caret(2, 3);
  T.type('新字');
  eq('增量: 块内输入与全量一致', blocksToMarkdown(root), T.out());
  T.caret(4, 0);
  T.key('Enter');
  eq('增量: 结构操作与全量一致', blocksToMarkdown(root), T.out());
  T.caret(1, 0);
  T.key('Backspace');
  eq('增量: 跨块合并与全量一致', blocksToMarkdown(root), T.out());
  // 空转 flush（DOM 没变）不得产出不同结果
  const mdBefore = T.out();
  ed.flush();
  eq('增量: 空转 flush 幂等', T.out(), mdBefore);
  // 撤销基线 = 源文本
  T.reset('# 源');
  eq('载入基线用源文本', ed.history[0].md, '# 源');

  // 1. 往返保真
  const SRC = [
    '# 标题',
    '',
    '普通 **粗体** 与 _斜体_ 和 `code`。',
    '',
    '- 项目一',
    '- 项目二',
    '  - 子项 A',
    '1. 第一',
    '2. 第二',
    '',
    '> 引用一行',
    '',
    '| 名称 | 数量 |',
    '| --- | ---: |',
    '| 苹果 | 3 |',
    '',
    '```js',
    'const a = 1;',
    '```',
    '',
    '---',
  ].join('\n');
  eq('往返保真', T.reset(SRC), SRC);

  // 1b. 图片：Markdown 里存相对路径，DOM 里用 data-src 记住原值
  T.reset('![图](assets/a.png)');
  eq('图片相对路径往返不丢', T.out(), '![图](assets/a.png)');
  eq('img 保留原始地址', root.querySelector('img').getAttribute('data-src'), 'assets/a.png');
  T.reset('![网图](https://example.com/x.png)');
  eq('网络图片原样', T.out(), '![网图](https://example.com/x.png)');

  /* 1c. 实体：inlineHtml 先把整段（含语法）escapeHtml，再从这段已转义文本里抽
     href / src / alt —— 抽出来必须反解一层再转义，否则属性被重复转义，
     `&amp;` 变 `&amp;amp;`，**打开再保存就污染文件**。 */
  eq('链接 URL 含 & 往返不涨',
    T.reset('[甲](https://e.com/a?x=1&y=2)'), '[甲](https://e.com/a?x=1&y=2)');
  eq('链接 URL 含实体往返不涨',
    T.reset('[甲](https://e.com/a?x=1&amp;y=2)'), '[甲](https://e.com/a?x=1&amp;y=2)');
  eq('href 属性还原为原文',
    (T.reset('[甲](https://e.com/a?x=1&y=2)'), root.querySelector('a').getAttribute('href')),
    'https://e.com/a?x=1&y=2');
  eq('图片地址含 & 往返不涨',
    T.reset('![甲](a.png?x=1&y=2)'), '![甲](a.png?x=1&y=2)');
  eq('图片 alt 含实体往返不涨',
    T.reset('![a&b 图](a.png)'), '![a&b 图](a.png)');
  eq('段落里的 & 与 < 往返不涨',
    T.reset('a & b &amp; c < d > e'), 'a & b &amp; c < d > e');
  eq('连续两次回读稳定',
    (T.reset('[甲](https://e.com/a?x=1&y=2)'), T.out(), T.reset(T.out()), T.out()),
    '[甲](https://e.com/a?x=1&y=2)');

  // 2. 段首语法糖
  T.reset('');
  T.type('- ');
  eq('输入 "- " 变无序列表', T.blocks()[0], 'li:ul@0=');
  T.type('一');
  T.key('Enter');
  T.type('二');
  eq('列表内回车接着编号', T.out(), '- 一\n- 二');

  // 3. 空列表项回车退出
  T.key('Enter');
  eq('空项回车先清标记', T.blocks().length, 3);
  T.key('Enter');
  eq('再回车退出列表', T.blocks()[2].startsWith('p'), true);

  // 2a. 逐字打 "- [ ] "：光标第一个空格就先把段落转成无序列表，
  // 后面这截 "[ ] " 得把已存在的无序项升级成任务项（否则圆点后面挂着一坨字面 "[ ]"）
  T.reset('');
  T.type('- ');
  T.type('[ ] ');
  eq('逐字输入 "- [ ] " 变任务项', T.blocks()[0], 'li:task@0=');
  T.type('待办');
  eq('任务项文字跟上', T.out(), '- [ ] 待办');

  // 2b. 已有文字前面补标记（光标在文字前，不是行尾）
  T.reset('已经写好的文字');
  T.caret(0, 0);
  T.type('## ');
  eq('文字前面输入 "## " 变二级标题', T.blocks()[0], 'h2=已经写好的文字');
  eq('光标停在标题文字前面', ed.caretState().offset, 0);
  T.type('新的');
  eq('接着输入落在文字前面', T.out(), '## 新的已经写好的文字');

  T.reset('**粗体**和 `码`');
  T.caret(0, 0);
  T.type('### ');
  eq('搬移后半段不丢行内样式', T.out(), '### **粗体**和 `码`');

  T.reset('引用内容');
  T.caret(0, 0);
  T.type('> ');
  eq('文字前面输入 "> " 变引用', T.out(), '> 引用内容');

  T.reset('第一项内容');
  T.caret(0, 0);
  T.type('1. ');
  eq('文字前面输入 "1. " 变有序列表', T.out(), '1. 第一项内容');

  T.reset('待办事项');
  T.caret(0, 0);
  T.type('- [ ] ');
  eq('文字前面输入 "- [ ] " 变任务项', T.blocks()[0], 'li:task@0=待办事项');

  T.reset('');
  T.type('```js');
  T.key('Enter');
  eq('"```js" + 回车 开代码块（语言名不丢）', root.children[0].dataset.lang, 'js');
  T.type('const a = 1;');
  eq('代码块内容跟上', T.out(), '```js\nconst a = 1;\n```');

  T.reset('');
  T.type('```');
  T.key('Enter');
  eq('裸三个反引号 + 回车 也开代码块', T.blocks()[0], 'code=');

  T.reset('');
  T.type('```');
  eq('只打三个反引号时还是普通段落（否则语言名无处可打）', T.blocks()[0], 'p=```');

  T.reset('const a = 1;');
  T.caret(0, 0);
  T.type('```js ');
  eq('文字前面输入 ``` 变代码块', T.out(), '```js\nconst a = 1;\n```');

  T.reset('第一行\n\n第二行');
  T.caret(1, 0);
  T.type('## ');
  eq('只影响光标那一行', T.out(), '第一行\n\n## 第二行');

  T.reset('文字');
  T.caret(0, 0);
  T.type('##');
  eq('只打 "##" 不带空格不变标题', T.blocks()[0], 'p=##文字');

  T.reset('abc def');
  T.caret(0, 3);
  T.type('- ');
  has('行中间输入 "- " 不触发', T.blocks().length === 1 && T.blocks()[0].startsWith('p'));

  // 4. Tab / Shift+Tab
  T.reset('- a\n- b');
  T.caret(1, 3);
  T.key('Tab');
  eq('Tab 缩进一级', T.out(), '- a\n  - b');
  T.key('Tab', { shiftKey: true });
  eq('Shift+Tab 退一级', T.out(), '- a\n- b');
  T.key('Tab', { shiftKey: true });
  eq('顶层再退变段落', T.out(), '- a\n\nb');

  // 5. 退格：列表项开头
  T.reset('- a\n  - b');
  T.caret(1, 0);
  T.key('Backspace');
  eq('缩进项退格退一级', T.out(), '- a\n- b');
  T.caret(1, 0);
  T.key('Backspace');
  eq('顶层列表项退格变段落', T.out(), '- a\n\nb');

  // 6. 有序列表重排
  T.reset('1. 甲\n2. 乙');
  T.caret(0, 2);
  T.key('Enter');
  T.type('丙');
  eq('中间插入自动重排', T.out(), '1. 甲\n2. 丙\n3. 乙');

  // 7. 引用
  T.reset('> 引用');
  T.caret(0, 2);
  T.key('Enter');
  T.type('续行');
  eq('引用内回车继续引用', T.out(), '> 引用\n> 续行');
  has('回车续行无 bqStart 标记', !root.querySelectorAll('.w-bq')[1].dataset.bqStart);

  // 7b. 两条独立引用：空行断组，第二组打 bqStart —— 视觉分开、序列化也不并段
  T.reset('> 第一条\n\n> 第二条');
  eq('空行断出两条引用往返', T.out(), '> 第一条\n\n> 第二条');
  const tq = root.querySelectorAll('.w-bq');
  has('第二条带 bqStart', tq[1].dataset.bqStart === '1');
  has('第一条无标记', !tq[0].dataset.bqStart);

  // 紧连两行 = 同一条引用，无标记
  T.reset('> 同一条\n> 续行');
  has('续行不打 bqStart', !root.querySelectorAll('.w-bq')[1].dataset.bqStart);
  eq('同一条引用紧凑往返', T.out(), '> 同一条\n> 续行');

  // 引用后面紧跟的段落转引用 = 新独立引用
  T.reset('> 已有引用\n\n新段落');
  T.caret(1, 0);
  ed.insertBlock('quote');
  has('段转引用且紧跟引用时打标记', root.querySelectorAll('.w-bq')[1].dataset.bqStart === '1');
  eq('两条独立引用存盘不并段', T.out(), '> 已有引用\n\n> 新段落');

  // 7c. 紧跟引用的段落上敲 "> "（输入转换路径）= 新独立引用，同样要打标记
  T.reset('> 已有\n\n新段');
  T.caret(1, 0);
  T.type('> ');
  has('敲 "> " 转引用打 bqStart', root.querySelectorAll('.w-bq')[1].dataset.bqStart === '1');
  eq('敲出的独立引用往返', T.out(), '> 已有\n\n> 新段');

  // 8. 表格
  T.reset('');
  ed.insertTable(3, 3);
  eq('插入 3x3 表格', T.out(), '|  |  |  |\n| --- | --- | --- |\n|  |  |  |\n|  |  |  |');
  T.type('名称');
  T.key('Tab');
  T.type('数量');
  T.key('Tab');
  T.type('备注');
  eq('Tab 在单元格间移动', T.cells()[0], '名称|数量|备注');
  T.key('Tab');
  T.type('一级');
  eq('第 3 次 Tab 落到下一行首列', T.cells()[1], '一级||');
  T.key('Enter');
  T.type('苹果');
  eq('回车换到下一行同列', T.cells()[2], '苹果||');
  has('表格 Markdown 带表头', T.out().split('\n').some((l) => l.startsWith('| 苹果 |')));

  // 9. 行内自动转换
  T.reset('');
  T.type('**粗**');
  eq('粗体标记转换', T.out(), '**粗**');
  has('确实生成了 strong', root.querySelector('strong'));
  T.type(' 尾');
  eq('粗体后继续输入', T.out(), '**粗** 尾');

  // 10. 行内样式不丢（回归）
  T.reset('**粗** 普通');
  T.caret(0, 6);
  T.type('!');
  eq('编辑后粗体标记仍在', T.out(), '**粗** 普通!');

  // 11. 删除合并
  T.reset('abc\ndef');
  T.caret(1, 0);
  T.key('Backspace');
  eq('行首 Backspace 并入上一行', T.out(), 'abcdef');

  // 12. 标题：回车后变正文
  T.reset('# 标题');
  T.caret(0, 4);
  T.key('Enter');
  T.type('正文');
  eq('标题内回车后是新段落', T.out(), '# 标题\n\n正文');

  // 13. 撤销
  T.reset('');
  T.type('abc');
  T.undo();
  eq('撤销回到空', T.out(), '');

  // 14. 任务列表
  T.reset('- [ ] 待办\n- [x] 完成');
  eq('任务列表往返', T.out(), '- [ ] 待办\n- [x] 完成');
  root.querySelectorAll('.w-check')[0].click();
  eq('点勾选框写回 Markdown', T.out(), '- [x] 待办\n- [x] 完成');

  // 15. 列表 / 标题切换
  T.reset('一段文字');
  T.caret(0, 0);
  ed.toggleList('ul');
  eq('段落转无序列表', T.out(), '- 一段文字');
  ed.toggleList('ul');
  eq('再点一次取消列表', T.out(), '一段文字');
  ed.toggleHeading(2);
  eq('转二级标题', T.out(), '## 一段文字');
  ed.toggleHeading(2);
  eq('再点一次回正文', T.out(), '一段文字');

  // 16. 表格行列增删
  T.reset('');
  ed.insertTable(2, 2);
  T.type('A');
  T.key('Tab');
  T.type('B');
  T.key('Tab');
  ed.tableCommand('rowBelow');
  eq('表格加一行', T.cells().length, 3);
  ed.tableCommand('delRow');
  eq('表格删一行', T.cells().length, 2);
  ed.focusCell(root.querySelector('.w-block'), 0, 1);
  ed.tableCommand('colAfter');
  eq('表格加一列', T.cells()[0], 'A|B|');
  ed.focusCell(root.querySelector('.w-block'), 0, 2);
  ed.tableCommand('delCol');
  eq('表格删一列', T.cells()[0], 'A|B');
  eq('表格 Markdown', T.out(), '| A | B |\n| --- | --- |\n|  |  |');

  // 17. 撤销结构操作
  T.reset('- a\n- b');
  T.caret(1, 3);
  T.key('Tab');
  eq('缩进生效', T.out(), '- a\n  - b');
  T.undo();
  eq('撤销缩进', T.out(), '- a\n- b');

  // 18. 多行粘贴按 Markdown 解析
  T.reset('');
  T.caret(0, 0);
  const dt = new DataTransfer();
  dt.setData('text/plain', '## 小标题\n- 甲\n- 乙');
  root.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
  eq('多行粘贴保留结构', T.out(), '## 小标题\n\n- 甲\n- 乙');

  // 18b. 代码块里粘贴 = 原文进块，绝不按 Markdown 解析
  //      （空代码块曾整块被 replaceWith 掉：粘一段 JSON，代码块凭空消失）
  T.reset('```json\n```');
  T.caret(0, 0);
  T.paste('{\n  "b": 2\n}');
  eq('空代码块内粘贴不会被换掉', T.blocks().map((s) => s.split('=')[0]).join(','), 'code');
  eq('空代码块内粘贴原文进块', T.out(), '```json\n{\n  "b": 2\n}\n```');

  T.reset('```json\n{"a": 1}\n```');
  ed.restoreCaret({ blockIndex: 0, offset: 8 });
  T.paste('{\n  "b": 2,\n  "c": [1, 2]\n}');
  eq('代码块行尾粘贴多行接在后面', T.out(), '```json\n{"a": 1}{\n  "b": 2,\n  "c": [1, 2]\n}\n```');

  T.reset('```js\nab\n```');
  ed.restoreCaret({ blockIndex: 0, offset: 1 });
  T.paste('XY');
  eq('代码块内粘贴单行', T.out(), '```js\naXYb\n```');

  T.reset('> [!info] 一\n> 内容A\n\n> [!warning] 二\n> 内容B');
  eq('相邻提示块之间保持空行（否则预览会连成一块）', T.out(), '> [!info] 一\n> 内容A\n\n> [!warning] 二\n> 内容B');
  T.reset('> [!info] 标题\n> 正文一\n> 正文二');

  // 34. 查找里的假匹配回归（搜「尾开」不该跨块命中）

  const cross = df.findInDom(root, /尾\n开/g);

  has('跨块匹配能还原成 Range', !!df.rangeFor(cross[0]));
  eq('不带换行仍然分块各算各的', df.findInDom(root, /甲结尾/g).length, 1);

  has('全部匹配注册了高亮', !!CSS.highlights.get('sn-find'));
  eq('画高亮不改动 DOM', root.innerHTML === before, 'true');
  df.clear();

  const im = root.querySelector('img.w-img');

  eq('拖拽改宽写回 alt 后缀', (ed.applyImgSize(im, 300), ed.hCoalesce = false, ed.flush(), T.out()), '![说明|300](a.png)');
  eq('改宽后不再保留旧高度', im.getAttribute('height'), 'null');
  ed.applyImgSize(im, 99999);
  has('宽度不会超过编辑区', Number(im.getAttribute('width')) <= root.clientWidth);
  eq('最小宽度有兜底', ed.applyImgSize(im, 8), 24);

  const fire = (type, x, y) => im2.dispatchEvent(new PointerEvent(type, {
    bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1,

    bubbles: true, cancelable: true, clientX: x, clientY: y, pointerId: 1,

  /* ============ 视口渲染（超大文档路径） ============ */
  {

    const seg = [
      '## 第 %n 节',
      '',
      '正文里有 **加粗**、_斜体_、`行内码` 和 [链接](https://example.com)。',
      '第二行紧跟着，用来验证「一行一块」。',
      '',
      '- 无序一',
      '- 无序二',
      '  - 嵌套项',
      '',
      '1. 有序一',
      '2. 有序二',
      '',
      '- [ ] 待办',
      '- [x] 已完成',
      '',
      '> 引用一行',
      '',
      '> [!info] 提示标题',
      '> 提示正文',
      '',
      '| 名称 | 数量 |',
      '| --- | ---: |',
      '| 苹果 | 3 |',
      '',
      '```js',
      'const a = 1;',
      'console.log(a);',
      '```',
      '',
      '$$',
      'E = mc^2',
      '$$',
      '',
      '---',
      '',
    ].join('\n');
    let big = '';
    for (let n = 1; big.length < 1_200_000; n++) big += seg.replace(/%n/g, n);

    const t0 = performance.now();
    ed.render(big);
    const loadMs = Math.round(performance.now() - t0);
    has('视口: 大文档走视口模式', ed.virtual === true);
    has('视口: DOM 里只有窗口', root.children.length > 0 && root.children.length < 400);

    const rt1 = ed.toMarkdown();
    has('视口: 往返长度一致', rt1.length === big.length);
    has('视口: 往返逐字节一致', rt1 === big);
    ed.render(big);
    has('视口: 二次渲染幂等', ed.toMarkdown() === big);

    /* 滚动：窗口要能把远处的内容搬进来 */
    const before = root.children[0].textContent;
    root.scrollTop = 60000;
    root.dispatchEvent(new Event('scroll'));
    has('视口: 滚动后窗口换了内容', root.children[0].textContent !== before);
    has('视口: 占位撑出剩余高度', parseFloat(root.style.getPropertyValue('--vpad-bot')) > 1000);
    has('视口: 滚动容器高度未被占位撑大', root.clientHeight < 2000);

    {                                  // 挑一个段落块：hr / 代码块不可编辑，插不进去

    const md0 = T.out();
    T.type('插入的字');
    const md1 = T.out();
    has('视口: 编辑后含新文字', md1.indexOf('插入的字') >= 0);
    has('视口: 编辑后只多出这几个字', md1.length >= md0.length + 4);
    // 改动的范围必须局限在光标附近（块间隔的局部归一化算在允许范围内）

      while (p < md0.length && md0[p] === md1[p]) p++;
      let s = 0;
      while (s < md0.length - p && md0[md0.length - 1 - s] === md1[md1.length - 1 - s]) s++;

    }

    has('视口: 跳到末块后窗口已前移', ed.winStart > 0);
    has('视口: 窗口覆盖到文末', ed.winStart + ed.winCount === ed.records.length);

    /* 前缀和只在块高变化时重算。滚动事件一秒几十次，白算一次就是 3ms，

    ed._rebuildCum();

    {
      const c100 = ed.cum[100];
      root.dispatchEvent(new Event('scroll'));
      has('视口: 视口未动时不重算前缀和', ed._cumDirty === false && ed.cum[100] === c100);
    }

    /* silent 必须在视口分支里复位。_render() 开头置真、本体末尾复位，

    has('视口: 载入后 silent 已复位', ed.silent === false);

    /* 全选：DOM 里只有窗口，原生 Ctrl+A 会退化成「只选窗口」，
       随后打字就等于把窗口外的内容当未选中删掉。必须走整篇语义。 */
    ed.render(big);
    {
      let k = 0;
      while (k < root.children.length && root.children[k].dataset.type !== 'p') k++;
      root.focus();
      ed.restoreCaret({ blockIndex: ed.winStart + k, offset: 0 });
    }
    ed._selectAllVirtual();
    has('视口: 全选标记置上', ed._selAll === true);
    has('视口: 选区覆盖整窗口', ed._selAllHeld() === true);
    ed.onBeforeInput({ inputType: 'insertText', data: '乙', preventDefault() {} });
    eq('视口: 全选后输入 = 整篇替换', ed.toMarkdown(), '乙');
    has('视口: 替换后全选标记已清', ed._selAll === false);
    has('视口: 替换可一步撤销', ed.undo() === true && ed.toMarkdown() === big);

    ed._selectAllVirtual();
    ed.onBeforeInput({ inputType: 'deleteContentBackward', preventDefault() {} });
    eq('视口: 全选后删除 = 清空整篇', ed.toMarkdown(), '');
    has('视口: 清空后回到非视口路径', ed.virtual === false);

    /* 切回小文档：padding 与模型状态都要清干净 */
    ed.render('# 小文档\n\n正文');
    has('视口: 回到小文档后退出视口模式', ed.virtual === false);
    has('视口: 占位变量已清空', root.style.getPropertyValue('--vpad-top') === '');
    eq('视口: 小文档往返', ed.toMarkdown(), '# 小文档\n\n正文');

    /* ---- 换块类型在视口模式下也要走记录模型 ----
       records 是块的唯一真相，原地换类型会改块数（多行代码块转引用按行拆），
       窗口 DOM 与 records 的对齐全靠 _syncWindow 的增删同步。 */
    {
      ed.render(big);
      root.focus();
      let k = 0;
      while (k < root.children.length
        && !(root.children[k].dataset.type === 'bq'
          && root.children[k].textContent.trim() === '引用一行')) k++;
      has('视口: 窗口里有引用可转', k < root.children.length);
      const md0 = ed.toMarkdown();
      const cnt = (s, sub) => s.split(sub).length - 1;
      const q0 = cnt(md0, '\n> 引用一行\n');
      const c0 = cnt(md0, '```\n引用一行\n```');
      has('视口: 文档里有多条同样的引用', q0 >= 1);
      ed.restoreCaret({ blockIndex: ed.winStart + k, offset: 0 });
      ed.insertBlock('code');
      const md1 = ed.toMarkdown();
      has('视口: 引用转代码块进了记录', cnt(md1, '```\n引用一行\n```') === c0 + 1);
      has('视口: 原引用行少了一条', cnt(md1, '\n> 引用一行\n') === q0 - 1);
      eq('视口: 只改了这一段', md1.length - md0.length, 6);   // "> 引用一行"(6) → 围栏版(12)
      has('视口: 换类型可一步撤销', ed.undo() === true && ed.toMarkdown() === big);
    }
    /* ---- 撤销：视口模式用「记录快照 + 写时复制」 ----
       整篇文本快照在 10MB 文档上要 12MB 一份，8MB 预算只够留 1 步（还得每次

    {
      ed.render(big);
      has('视口: 基线快照是记录而不是整篇文本',
        !!ed.history[0].recs && ed.history[0].md === undefined);

      const pickP = () => {
        let k = 0;

      const t1 = performance.now();
      const undone = ed.undo() && ed.undo() && ed.undo();
      const undoMs = performance.now() - t1;
      has('视口: 三步都能撤', undone === true);
      has('视口: 撤销三步回到原文', ed.toMarkdown() === base);
      has('视口: 撤销后仍是视口模式', ed.virtual === true);
      has('视口: 撤销不必整篇重解析', undoMs < 900);
      has('视口: 重做回到编辑后', ed.redo() === true && ed.toMarkdown() !== base);
    }

    {
      ed.render(big);

      root.focus();
      let k = 0;
      while (k < root.children.length && root.children[k].textContent.indexOf('第二行紧跟着') < 0) k++;
      has('视口: 找到软换行块', k < root.children.length);
      ed.restoreCaret({ blockIndex: ed.winStart + k, offset: 0 });
      T.type('X');
      const out2 = ed.toMarkdown();
      has('视口: 软换行没被拆成两段', out2.indexOf('\n\n第二行紧跟着') < 0);
      has('视口: 软换行块内容已更新', out2.indexOf('X第二行紧跟着') >= 0);
      has('视口: 软换行编辑只多了那一个字', out2.length === prev.length + 1);

    {

      root.focus();
      let k = 0;
      while (k < root.children.length && root.children[k].dataset.type !== 'p') k++;
      ed.restoreCaret({ blockIndex: ed.winStart + k, offset: 0 });
      const sel = window.getSelection();
      const rg = sel.getRangeAt(0);
      const last = root.children[root.children.length - 1];
      rg.setEnd(last.querySelector('.w-text'), 0);
      sel.removeAllRanges();
      sel.addRange(rg);
      const count0 = ed.winCount;
      const text0 = sel.toString().length;

      ed._drag = true;
      root.scrollTop = root.clientHeight * 3.5;   // 模拟拖到屏底后的自动滚屏
      root.dispatchEvent(new Event('scroll'));
      has('视口: 拖选时窗口只长不搬', ed.winStart === 0);
      has('视口: 拖选时窗口已续长', ed.winCount > count0);
      has('视口: 拖选时选区还在', window.getSelection().toString().length >= text0);
      ed._drag = false;

      /* 松手后恢复常态：滚动照旧搬家 */
      root.scrollTop = root.clientHeight * 14;
      root.dispatchEvent(new Event('scroll'));
      has('视口: 松手后窗口恢复搬家', ed.winStart > 0);
    }

  }

  /* ---- 35. 块级操作：引用整组是一个逻辑块 ----

    T.reset('> 第一行\n> 第二行\n> 第三行\n\n> 另一组\n> 续行');

    eq('引用组：独立组两行', ed.bqGroupOf(all[4]).length, 2);
    T.reset('段落甲');
    eq('引用组：普通段落自成一块', ed.bqGroupOf(root.children[0]).length, 1);

    T.reset('> 第一行\n> 第二行\n> 第三行');
    T.caret(2, 0);
    ed.convertBlock('h2');
    eq('引用续行上转标题：整组一起转', T.out(), '## 第一行\n\n## 第二行\n\n## 第三行');
    eq('引用续行上转标题：没有半截引用', root.querySelectorAll('.w-bq').length, 0);

    /* 块级删除：从续行删，整组一起没；块内退格仍按行并回上一行 */
    T.reset('> 第一行\n> 第二行\n> 第三行\n\n尾段');
    ed.deleteBlock(root.children[2]);
    eq('块级删除：引用整组一起删', T.blocks().join(','), 'p=尾段');
    T.reset('> 第一行\n> 第二行');
    T.caret(1, 0);
    T.key('Backspace');
    eq('块内退格仍按行：续行并回上一行', T.out(), '> 第一行第二行');

    /* 标题后多空行退格：一次只少一行，留下的空块必须撑住行高，光标不进标题 */
    T.reset('# 标题\n\n\n\n正文');
    T.caret(2, 0);
    T.key('Backspace');
    eq('多空行退格：一次只少一行', T.blocks().join(','), 'h1=标题,p=,p=正文');
    has('多空行退格：空块留了占位 br，不塌成 0 高',
      !!root.children[1].querySelector('.w-text br'));
    /* 用户看到的「一次删两行」是行盒塌成 0 高的视觉症状，DOM 结构看不出来
       （块还在、只是没高度）。必须量真实高度，否则换回旧实现断言不会红。 */
    has('多空行退格：空块仍占一行高，不会一次看着少两行',
      root.children[1].getBoundingClientRect().height >= 12);
    eq('多空行退格：光标留在空块里，没跑进标题', ed.caretState().blockIndex, 1);

    /* 边界块（代码块 / 表格）后面那个空段落行首退格要真删掉 */
    T.reset('```js\nlet a = 1;\n```\n\n');
    T.caret(1, 0);
    T.key('Backspace');
    eq('代码块后空行退格：空行被删掉', T.blocks().length, 1);
    has('代码块后空行退格：剩下的是代码块', T.blocks()[0].startsWith('code='));
    T.reset('| A | B |\n| --- | --- |\n| 1 | 2 |\n\n');
    T.caret(1, 0);
    T.key('Backspace');
    eq('表格后空行退格：空行被删掉', T.blocks().length, 1);
    has('表格后空行退格：剩下的是表格', T.blocks()[0].startsWith('table='));
  }

  /* ---- 正文光标：自绘工字 ---- 系统 I-beam 只有 1px，且 Chromium 会按背景
     明暗自己翻成白/黑，翻成白色时在浅底上几乎看不见。这里断言我们接管了它。
     必须是 PNG：cursor 对 SVG 的支持不可靠（解析得过却渲染不出时，光标直接消失） */
  {
    const cur = getComputedStyle(document.getElementById('wysiwyg')).cursor;
    /* 两种合法形态：老引擎只认 url()，新引擎是 image-set()（2x 图必须靠它
       声明密度，直接写 url() 会被按 1x 渲染 —— 高分屏上光标整整大一倍）。
       两者共同点：内嵌 PNG 图，且后面留着系统 text 光标兜底 */
    has('光标: 正文用自绘工字', /^(url|image-set)\(/.test(cur) && cur.includes('data:image/png'));
    has('光标: 热区在竖线正中', /7\s*12/.test(cur));
    has('光标: 保留 text 兜底', /,\s*text\s*$/.test(cur));

    const readVar = (theme) => {
      const old = document.body.dataset.theme;
      document.body.dataset.theme = theme;
      const v = getComputedStyle(document.body).getPropertyValue('--cur-text').trim();
      document.body.dataset.theme = old;
      return v;
    };
    const l = readVar('light');
    const d = readVar('dark');
    has('光标: 明暗各一套', l !== d && l.includes('data:image/png') && d.includes('data:image/png'));
  }

  return R;
};

window.__ready = true;
</script>
</body>
</html>
